<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Skybound — 3D Platformer</title>
  <link rel="icon" href="/favicons/platformer-3d.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body { margin: 0; overflow: hidden; color: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #07111f; user-select: none; }
    #game, canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; z-index: 3; inset: 0; padding: clamp(14px, 2.4vw, 30px); pointer-events: none; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .brand, .stats { border: 1px solid rgba(255, 255, 255, .17); background: linear-gradient(145deg, rgba(7, 17, 31, .78), rgba(7, 23, 37, .58)); box-shadow: 0 18px 50px rgba(0, 0, 0, .25), inset 0 1px rgba(255, 255, 255, .06); backdrop-filter: blur(14px) saturate(130%); }
    .brand { min-width: min(330px, 55vw); padding: 13px 17px; border-radius: 18px; }
    .eyebrow { color: #62f2cf; font-size: 9px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
    .brand h1 { margin: 4px 0 5px; font-size: clamp(19px, 2.7vw, 29px); line-height: 1; letter-spacing: -.045em; }
    .brand p { margin: 0; color: #a9bdd1; font-size: 12px; }
    .progress { height: 3px; margin-top: 11px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, .12); }
    #progressFill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #53e8c1, #ffdc68); box-shadow: 0 0 12px #53e8c1; }
    .stats { display: flex; overflow: hidden; border-radius: 16px; }
    .stat { min-width: 76px; padding: 10px 14px; text-align: center; border-left: 1px solid rgba(255, 255, 255, .1); }
    .stat:first-child { border-left: 0; }
    .stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
    .stat span { color: #9eb1c4; font-size: 9px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .controls { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 9px 15px; border: 1px solid rgba(255, 255, 255, .13); border-radius: 999px; color: #a9bdd1; background: rgba(7, 17, 31, .68); font-size: 11px; white-space: nowrap; backdrop-filter: blur(11px); }
    .controls b { color: #fff; }
    .back { position: absolute; left: clamp(14px, 2.4vw, 30px); bottom: 20px; padding: 9px 13px; border: 1px solid rgba(255, 255, 255, .13); border-radius: 999px; pointer-events: auto; color: #b9d6e8; background: rgba(7, 17, 31, .68); font-size: 12px; text-decoration: none; backdrop-filter: blur(10px); }
    .back:hover { color: #63f0ce; }
    .message { position: absolute; inset: 0; display: grid; place-items: center; visibility: hidden; opacity: 0; pointer-events: auto; background: rgba(3, 8, 18, .46); transition: opacity .25s, visibility .25s; }
    .message.show { visibility: visible; opacity: 1; }
    .card { width: min(430px, calc(100vw - 32px)); padding: 31px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 25px; text-align: center; background: linear-gradient(145deg, rgba(8, 23, 39, .94), rgba(7, 16, 30, .91)); box-shadow: 0 28px 90px rgba(0, 0, 0, .46), inset 0 1px rgba(255, 255, 255, .07); backdrop-filter: blur(18px); }
    .card .eyebrow { color: #56e8c4; }
    .card h2 { margin: 9px 0; font-size: 36px; letter-spacing: -.05em; }
    .card p { margin: 0 0 20px; color: #a9bdd1; line-height: 1.5; }
    .card button { padding: 12px 23px; border: 0; border-radius: 999px; color: #07151d; background: #56e8c4; font-weight: 900; cursor: pointer; box-shadow: 0 8px 25px rgba(50, 220, 180, .3); }
    .touch { position: fixed; z-index: 4; inset: auto 0 18px; display: none; justify-content: space-between; padding: 0 18px; pointer-events: none; }
    .touch div { display: flex; align-items: flex-end; gap: 10px; }
    .touch button { width: 62px; height: 62px; border: 1px solid rgba(255, 255, 255, .26); border-radius: 50%; pointer-events: auto; color: #fff; background: rgba(7, 17, 31, .74); font-size: 20px; backdrop-filter: blur(10px); touch-action: none; }
    .touch .jump { width: 72px; height: 72px; background: rgba(47, 205, 174, .8); font-size: 12px; font-weight: 900; }
    .touch .shoot { color: #17202a; background: rgba(255, 218, 98, .84); font-size: 11px; font-weight: 900; }
    .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 130px rgba(15, 44, 61, .28); }
    @media (pointer: coarse), (max-width: 700px) {
      .touch { display: flex; }
      .controls { display: none; }
      .back { bottom: 100px; }
      .brand { min-width: 0; }
      .brand p, .progress { display: none; }
      .stat { min-width: 58px; padding: 9px; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="vignette"></div>
  <div class="hud">
    <div class="topbar">
      <section class="brand">
        <div class="eyebrow">Expedition // Cloudline</div>
        <h1>SKYBOUND</h1>
        <p>A tiny journey above the clouds</p>
        <div class="progress"><div id="progressFill"></div></div>
      </section>
      <section class="stats">
        <div class="stat"><strong id="gems">0/7</strong><span>Shards</span></div>
        <div class="stat"><strong id="lives">3</strong><span>Lives</span></div>
      </section>
    </div>
    <a class="back" href="/index.html">← All games</a>
    <div class="controls"><b>A D</b> / <b>← →</b> move &nbsp;·&nbsp; <b>Space</b> jump &nbsp;·&nbsp; <b>Ctrl</b> shoot &nbsp;·&nbsp; <b>R</b> restart</div>
    <div id="message" class="message">
      <div class="card">
        <span id="messageEyebrow" class="eyebrow">JOURNEY COMPLETE</span>
        <h2 id="messageTitle">You made it!</h2>
        <p id="result">The summit is yours.</p>
        <button id="again">Play again</button>
      </div>
    </div>
  </div>
  <div class="touch">
    <div><button data-key="left" aria-label="Move left">←</button><button data-key="right" aria-label="Move right">→</button></div>
    <div><button class="shoot" data-action="shoot">SHOOT</button><button class="jump" data-key="jump">JUMP</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    (() => {
      const gemsEl = document.getElementById('gems');
      const livesEl = document.getElementById('lives');
      const progressEl = document.getElementById('progressFill');
      const messageEl = document.getElementById('message');
      const messageEyebrowEl = document.getElementById('messageEyebrow');
      const messageTitleEl = document.getElementById('messageTitle');
      const resultEl = document.getElementById('result');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x91cbe0);
      scene.fog = new THREE.Fog(0x91cbe0, 26, 82);

      const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 145);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      document.getElementById('game').appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xdff7ff, 0x385e55, 2.25));
      const sun = new THREE.DirectionalLight(0xfff4d6, 3.25);
      sun.position.set(-12, 24, 15);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -24;
      sun.shadow.camera.right = 24;
      sun.shadow.camera.top = 24;
      sun.shadow.camera.bottom = -18;
      scene.add(sun, sun.target);

      const sunDisc = new THREE.Mesh(
        new THREE.SphereGeometry(3.7, 28, 15),
        new THREE.MeshBasicMaterial({ color: 0xffedb0 }),
      );
      sunDisc.position.set(-24, 24, -45);
      scene.add(sunDisc);
      const sunHalo = new THREE.Mesh(
        new THREE.RingGeometry(4.1, 6.2, 48),
        new THREE.MeshBasicMaterial({ color: 0xffefb7, transparent: true, opacity: .18, side: THREE.DoubleSide }),
      );
      sunHalo.position.copy(sunDisc.position);
      scene.add(sunHalo);

      const platforms = [];
      const gems = [];
      const enemies = [];
      const bullets = [];
      const particles = [];
      const rockMaterial = new THREE.MeshStandardMaterial({ color: 0x315752, roughness: .9 });
      const rockAccentMaterial = new THREE.MeshStandardMaterial({ color: 0x274944, roughness: 1 });
      const grassMaterial = new THREE.MeshPhysicalMaterial({ color: 0x63d39c, roughness: .65, clearcoat: .18 });

      function addPlatform(x, y, width, height = 1) {
        const group = new THREE.Group();
        const rock = new THREE.Mesh(new THREE.BoxGeometry(width, height, 4), rockMaterial);
        rock.position.y = -height / 2;
        rock.castShadow = true;
        rock.receiveShadow = true;
        const grass = new THREE.Mesh(new THREE.BoxGeometry(width + .14, .22, 4.14), grassMaterial);
        grass.position.y = .05;
        grass.castShadow = true;
        grass.receiveShadow = true;
        group.add(rock, grass);

        // Uneven underside stones keep collision geometry simple while the island silhouette stays organic.
        for (let index = 0; index < Math.max(2, Math.floor(width / 2)); index += 1) {
          const stone = new THREE.Mesh(new THREE.ConeGeometry(.55 + Math.random() * .45, 1.2 + Math.random() * 1.8, 5), rockAccentMaterial);
          stone.position.set(-width / 2 + .7 + index * (width - 1.4) / Math.max(1, Math.floor(width / 2) - 1), -height - .45, (index % 3 - 1) * .8);
          stone.rotation.z = (Math.random() - .5) * .35;
          stone.castShadow = true;
          group.add(stone);
        }

        group.position.set(x, y, 0);
        scene.add(group);
        platforms.push({ x, y, width, height });

        for (let index = 0; index < Math.floor(width / 1.6); index += 1) {
          const blade = new THREE.Mesh(new THREE.ConeGeometry(.075, .34, 4), grassMaterial);
          blade.position.set(x - width / 2 + .5 + index * 1.5, y + .28, (index % 3 - 1) * 1.35);
          blade.rotation.z = index % 2 ? .15 : -.15;
          scene.add(blade);
        }
      }

      [
        [0, 0, 10, 2], [8, 1.8, 4.8, 1.4], [15, 3.6, 4, 1.2], [22, 1.8, 5, 1.5],
        [30, 3.8, 4.5, 1.4], [38, 5.6, 6, 1.6], [47, 3.8, 4.5, 1.3],
        [55, 5.6, 4, 1.2], [63, 7.4, 7, 1.8], [73, 5.2, 5, 1.5], [82, 7, 7, 2],
      ].forEach((data) => addPlatform(...data));

      const gemMaterial = new THREE.MeshPhysicalMaterial({ color: 0x66fff0, emissive: 0x20bfae, emissiveIntensity: 1.3, metalness: .25, roughness: .12, clearcoat: 1 });
      [8, 15, 30, 38, 55, 63, 73].forEach((x, index) => {
        const platform = platforms.find((item) => item.x === x);
        const group = new THREE.Group();
        const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(.48, 0), gemMaterial);
        crystal.castShadow = true;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(.72, .025, 7, 28), new THREE.MeshBasicMaterial({ color: 0xb0fff5, transparent: true, opacity: .62 }));
        ring.rotation.x = Math.PI / 2;
        group.add(crystal, ring);
        group.position.set(x, platform.y + 1.3, 0);
        scene.add(group);
        gems.push({ mesh: group, crystal, ring, baseY: group.position.y, phase: index, taken: false });
      });

      const enemyMaterial = new THREE.MeshPhysicalMaterial({ color: 0xff637d, emissive: 0x8c182c, emissiveIntensity: .55, roughness: .38, clearcoat: .7 });
      function addEnemy(x, y, range, phase) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(.66, 18, 11), enemyMaterial);
        body.scale.set(1, .78, .9);
        body.castShadow = true;
        const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x220b17 });
        [-.22, .22].forEach((eyeX) => {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 6), eyeMaterial);
          eye.position.set(eyeX, .12, .58);
          group.add(eye);
        });
        [-.32, .32].forEach((footX) => {
          const foot = new THREE.Mesh(new THREE.SphereGeometry(.22, 10, 7), enemyMaterial);
          foot.scale.y = .55;
          foot.position.set(footX, -.48, 0);
          group.add(foot);
        });
        group.add(body);
        group.position.set(x, y, 0);
        scene.add(group);
        enemies.push({ mesh: group, origin: x, baseY: y, range, phase, active: true });
      }
      [[22, 2.45, 2], [47, 4.45, 1.5], [73, 5.85, 1.7]].forEach(([x, y, range], index) => addEnemy(x, y, range, index * 2));

      const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, 5, 10), new THREE.MeshStandardMaterial({ color: 0xeef8ff, metalness: .6 }));
      flagPole.position.set(84.5, 9.55, 0);
      flagPole.castShadow = true;
      scene.add(flagPole);
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.2, 8, 3), new THREE.MeshPhysicalMaterial({ color: 0xffda62, side: THREE.DoubleSide, roughness: .55 }));
      flag.position.set(85.5, 11.2, 0);
      scene.add(flag);

      const cloudMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .74, roughness: 1, depthWrite: false });
      const clouds = [];
      for (let index = 0; index < 24; index += 1) {
        const group = new THREE.Group();
        for (let puff = 0; puff < 4; puff += 1) {
          const cloud = new THREE.Mesh(new THREE.SphereGeometry(1.35 + Math.random() * 1.45, 12, 8), cloudMaterial);
          cloud.scale.y = .42;
          cloud.position.set(puff * 1.45, Math.random() * .45, (puff % 2) * .45);
          group.add(cloud);
        }
        group.position.set(-18 + index * 5.5 + Math.random() * 3, -3 - Math.random() * 5, -10 - Math.random() * 24);
        scene.add(group);
        clouds.push(group);
      }
      const mountainMaterial = new THREE.MeshStandardMaterial({ color: 0x568983, roughness: 1 });
      for (let index = 0; index < 17; index += 1) {
        const mountain = new THREE.Mesh(new THREE.ConeGeometry(4 + Math.random() * 5, 10 + Math.random() * 9, 6), mountainMaterial);
        mountain.position.set(-22 + index * 8, -5, -24 - Math.random() * 11);
        scene.add(mountain);
      }

      const player = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(.4, .45, 6, 14),
        new THREE.MeshPhysicalMaterial({ color: 0xf5fbff, roughness: .28, clearcoat: .72 }),
      );
      body.castShadow = true;
      player.add(body);
      const visor = new THREE.Mesh(
        new THREE.SphereGeometry(.29, 14, 8),
        new THREE.MeshPhysicalMaterial({ color: 0x163044, emissive: 0x0a2638, metalness: .65, roughness: .14, clearcoat: 1 }),
      );
      visor.scale.set(1, .55, .38);
      visor.position.set(0, .16, .39);
      body.add(visor);
      const scarf = new THREE.Mesh(new THREE.BoxGeometry(.72, .13, .12), new THREE.MeshStandardMaterial({ color: 0xffd45f, roughness: .6 }));
      scarf.position.set(-.4, .28, 0);
      player.add(scarf);
      scene.add(player);

      const bulletGeometry = new THREE.SphereGeometry(.13, 10, 7);
      const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffe27a });
      const keys = { left: false, right: false, jump: false };
      const velocity = { x: 0, y: 0 };
      const start = { x: -2, y: 2 };
      const clock = new THREE.Clock();
      let grounded = false;
      let lives = 3;
      let collected = 0;
      let ended = false;
      let invincibility = 0;
      let facing = 1;
      let shootCooldown = 0;
      let coyoteTimer = 0;
      let jumpBuffer = 0;
      let landingVelocity = 0;

      function burst(position, color, count = 12) {
        for (let index = 0; index < count; index += 1) {
          const particle = new THREE.Mesh(
            new THREE.IcosahedronGeometry(.035 + Math.random() * .06, 0),
            new THREE.MeshBasicMaterial({ color, transparent: true }),
          );
          particle.position.copy(position);
          particle.userData.velocity = new THREE.Vector3((Math.random() - .5) * 5, Math.random() * 4, (Math.random() - .5) * 3);
          particle.userData.life = .45 + Math.random() * .3;
          scene.add(particle);
          particles.push(particle);
        }
      }

      function clearBullets() {
        bullets.forEach((bullet) => scene.remove(bullet.mesh));
        bullets.length = 0;
      }

      function resetPlayer() {
        player.position.set(start.x, start.y, 0);
        player.visible = true;
        velocity.x = 0;
        velocity.y = 0;
        grounded = false;
        body.rotation.x = 0;
        invincibility = 1.2;
        coyoteTimer = 0;
        jumpBuffer = 0;
        clearBullets();
      }

      function updateHud() {
        gemsEl.textContent = `${collected}/${gems.length}`;
        livesEl.textContent = lives;
        progressEl.style.width = `${THREE.MathUtils.clamp((player.position.x - start.x) / 84 * 100, 0, 100)}%`;
      }

      function hideMessage() {
        messageEl.classList.remove('show');
      }

      function showMessage(eyebrow, title, text) {
        messageEyebrowEl.textContent = eyebrow;
        messageTitleEl.textContent = title;
        resultEl.textContent = text;
        messageEl.classList.add('show');
      }

      function restart() {
        lives = 3;
        collected = 0;
        ended = false;
        facing = 1;
        shootCooldown = 0;
        keys.left = false;
        keys.right = false;
        keys.jump = false;
        hideMessage();
        gems.forEach((gem) => {
          gem.taken = false;
          gem.mesh.visible = true;
        });
        enemies.forEach((enemy) => {
          enemy.active = true;
          enemy.mesh.visible = true;
          enemy.mesh.position.x = enemy.origin;
          enemy.mesh.position.y = enemy.baseY;
        });
        particles.splice(0).forEach((particle) => scene.remove(particle));
        resetPlayer();
        updateHud();
      }

      function loseLife() {
        if (invincibility > 0 || ended) return;
        lives -= 1;
        burst(player.position, 0xf5fbff, 18);
        updateHud();
        if (lives <= 0) {
          lives = 0;
          ended = true;
          player.visible = false;
          clearBullets();
          updateHud();
          showMessage('JOURNEY INTERRUPTED', 'Lost in the clouds', `You recovered ${collected} of ${gems.length} sky shards. Try the route again.`);
          return;
        }
        resetPlayer();
      }

      function shoot() {
        if (ended || shootCooldown > 0) return;
        const mesh = new THREE.Mesh(bulletGeometry, bulletMaterial);
        mesh.position.set(player.position.x + facing * .7, player.position.y + .05, 0);
        scene.add(mesh);
        bullets.push({ mesh, velocityX: facing * 18 });
        shootCooldown = .18;
      }

      function bulletHitsPlatform(fromX, toX, y) {
        const radius = .13;
        const travelMin = Math.min(fromX, toX);
        const travelMax = Math.max(fromX, toX);
        return platforms.some((platform) => (
          y + radius > platform.y - platform.height &&
          y - radius < platform.y + .16 &&
          travelMax > platform.x - platform.width / 2 - radius &&
          travelMin < platform.x + platform.width / 2 + radius
        ));
      }

      function pressJump() {
        keys.jump = true;
        jumpBuffer = .12;
      }

      // Для геймдизайнера: отпускание кнопки срезает скорость вверх. Короткое
      // нажатие даёт точный низкий прыжок, удержание — полный прыжок через разрыв.
      function releaseJump() {
        if (keys.jump && velocity.y > 0) velocity.y *= .48;
        keys.jump = false;
      }

      addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') keys.left = true;
        if (key === 'arrowright' || key === 'd') keys.right = true;
        if ((key === ' ' || key === 'arrowup' || key === 'w') && !event.repeat) {
          pressJump();
          event.preventDefault();
        }
        if (key === 'control' && !event.repeat) {
          shoot();
          event.preventDefault();
        }
        if (key === 'r') restart();
      });
      addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft' || key === 'a') keys.left = false;
        if (key === 'arrowright' || key === 'd') keys.right = false;
        if (key === ' ' || key === 'arrowup' || key === 'w') releaseJump();
      });
      addEventListener('blur', () => {
        keys.left = false;
        keys.right = false;
        releaseJump();
      });

      document.querySelectorAll('[data-key]').forEach((button) => {
        const key = button.dataset.key;
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.setPointerCapture(event.pointerId);
          if (key === 'jump') pressJump();
          else keys[key] = true;
        });
        const release = (event) => {
          event.preventDefault();
          if (key === 'jump') releaseJump();
          else keys[key] = false;
        };
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });
      document.querySelector('[data-action="shoot"]').addEventListener('pointerdown', (event) => {
        event.preventDefault();
        shoot();
      });
      document.getElementById('again').addEventListener('click', restart);

      // Для программиста: горизонтальная и вертикальная оси решаются отдельно.
      // Такой AABB-проход не даёт герою проваливаться в угол соседней платформы.
      function movePlayer(dt) {
        const desiredVelocity = (keys.right ? 7 : 0) - (keys.left ? 7 : 0);
        if (desiredVelocity) facing = Math.sign(desiredVelocity);
        velocity.x += (desiredVelocity - velocity.x) * Math.min(1, dt * 12);
        if (!keys.left && !keys.right) velocity.x *= Math.pow(.05, dt);

        coyoteTimer = grounded ? .11 : Math.max(0, coyoteTimer - dt);
        jumpBuffer = Math.max(0, jumpBuffer - dt);
        if (jumpBuffer > 0 && coyoteTimer > 0) {
          velocity.y = 12.3;
          grounded = false;
          coyoteTimer = 0;
          jumpBuffer = 0;
          burst(player.position, 0xd8fff1, 5);
        }
        velocity.y -= 25 * dt;

        const halfWidth = .5;
        const halfHeight = .625;
        player.position.x += velocity.x * dt;
        for (const platform of platforms) {
          const top = platform.y + .16;
          const verticalOverlap = player.position.y + halfHeight > platform.y - platform.height && player.position.y - halfHeight < top;
          const projectedBottom = player.position.y + velocity.y * dt - halfHeight;
          const clearsTop = velocity.y > 0 && projectedBottom >= top;
          const landingTolerance = Math.max(.08, -velocity.y * dt + .02);
          const landsOnTop = velocity.y <= 0 && player.position.y - halfHeight >= top - landingTolerance && projectedBottom <= top;
          const horizontalOverlap = player.position.x + halfWidth > platform.x - platform.width / 2 && player.position.x - halfWidth < platform.x + platform.width / 2;
          if (verticalOverlap && !clearsTop && !landsOnTop && horizontalOverlap) {
            player.position.x = velocity.x > 0 ? platform.x - platform.width / 2 - halfWidth : platform.x + platform.width / 2 + halfWidth;
            velocity.x = 0;
          }
        }

        const oldY = player.position.y;
        const wasGrounded = grounded;
        landingVelocity = velocity.y;
        player.position.y += velocity.y * dt;
        grounded = false;
        for (const platform of platforms) {
          const horizontalOverlap = player.position.x + halfWidth > platform.x - platform.width / 2 && player.position.x - halfWidth < platform.x + platform.width / 2;
          if (!horizontalOverlap) continue;
          const top = platform.y + .16;
          const bottom = platform.y - platform.height;
          const oldTop = oldY + halfHeight;
          const oldBottom = oldY - halfHeight;
          const newTop = player.position.y + halfHeight;
          const newBottom = player.position.y - halfHeight;
          const fallStep = Math.max(.08, -velocity.y * dt + .02);
          if (velocity.y <= 0 && oldBottom >= top - fallStep && newBottom <= top) {
            player.position.y = top + halfHeight;
            velocity.y = 0;
            grounded = true;
          } else if (velocity.y > 0 && oldTop <= bottom + .08 && newTop >= bottom) {
            player.position.y = bottom - halfHeight;
            velocity.y = 0;
          }
        }
        if (!wasGrounded && grounded && landingVelocity < -7) burst(player.position, 0xd8fff1, 7);

        player.rotation.z += (-velocity.x * .035 - player.rotation.z) * Math.min(1, dt * 10);
        scarf.position.x = -facing * .42;
        scarf.rotation.z = facing * velocity.x * .018;
      }

      function updateCollectibles(dt, time) {
        gems.forEach((gem) => {
          if (gem.taken) return;
          gem.crystal.rotation.y += dt * 2.5;
          gem.crystal.rotation.x += dt * .65;
          gem.ring.rotation.z -= dt * 1.1;
          gem.mesh.position.y = gem.baseY + Math.sin(time * 3 + gem.phase) * .14;
          if (gem.mesh.position.distanceTo(player.position) < 1.25) {
            gem.taken = true;
            gem.mesh.visible = false;
            collected += 1;
            burst(gem.mesh.position, 0x66fff0, 16);
            updateHud();
          }
        });
      }

      function updateBullets(dt) {
        shootCooldown = Math.max(0, shootCooldown - dt);
        for (let index = bullets.length - 1; index >= 0; index -= 1) {
          const bullet = bullets[index];
          const oldX = bullet.mesh.position.x;
          const newX = oldX + bullet.velocityX * dt;
          bullet.mesh.position.x = newX;
          let hit = bulletHitsPlatform(oldX, newX, bullet.mesh.position.y);
          if (!hit) {
            for (const enemy of enemies) {
              if (!enemy.active) continue;
              const crossedX = Math.min(oldX, newX) < enemy.mesh.position.x + .75 && Math.max(oldX, newX) > enemy.mesh.position.x - .75;
              if (crossedX && Math.abs(bullet.mesh.position.y - enemy.mesh.position.y) < .78) {
                enemy.active = false;
                enemy.mesh.visible = false;
                burst(enemy.mesh.position, 0xff637d, 14);
                hit = true;
                break;
              }
            }
          }
          if (hit || Math.abs(bullet.mesh.position.x - player.position.x) > 28) {
            scene.remove(bullet.mesh);
            bullets.splice(index, 1);
          }
        }
      }

      function updateEnemies(dt, time) {
        enemies.forEach((enemy) => {
          if (!enemy.active) return;
          enemy.mesh.position.x = enemy.origin + Math.sin(time * 1.6 + enemy.phase) * enemy.range;
          enemy.mesh.position.y = enemy.baseY + Math.sin(time * 3.2 + enemy.phase) * .08;
          enemy.mesh.rotation.y += dt * 1.6;
          if (enemy.mesh.position.distanceTo(player.position) < 1.05) loseLife();
        });
      }

      function updateParticles(dt) {
        for (let index = particles.length - 1; index >= 0; index -= 1) {
          const particle = particles[index];
          particle.position.addScaledVector(particle.userData.velocity, dt);
          particle.userData.velocity.y -= 7 * dt;
          particle.userData.life -= dt;
          particle.material.opacity = Math.max(0, particle.userData.life * 1.8);
          particle.scale.setScalar(Math.max(.01, particle.userData.life));
          if (particle.userData.life <= 0) {
            scene.remove(particle);
            particles.splice(index, 1);
          }
        }
      }

      function finishJourney() {
        ended = true;
        clearBullets();
        const result = collected === gems.length
          ? 'Perfect run — every sky shard collected!'
          : `You found ${collected} of ${gems.length} sky shards.`;
        showMessage('JOURNEY COMPLETE', 'You made it!', result);
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), .035);
        const time = clock.elapsedTime;

        if (!ended) {
          movePlayer(dt);
          updateCollectibles(dt, time);
          updateBullets(dt);
          updateEnemies(dt, time);
          if (player.position.y < -10) loseLife();
          invincibility = Math.max(0, invincibility - dt);
          player.visible = invincibility <= 0 || Math.floor(invincibility * 12) % 2 === 0;
          if (player.position.x > 81.5) finishJourney();
        }

        updateParticles(dt);
        clouds.forEach((cloud, index) => { cloud.position.x += Math.sin(time * .12 + index) * dt * .035; });
        const flagPositions = flag.geometry.attributes.position;
        for (let index = 0; index < flagPositions.count; index += 1) {
          const localX = flagPositions.getX(index);
          flagPositions.setZ(index, Math.sin(time * 4 + localX * 2.4) * .08 * (localX + 1.05));
        }
        flagPositions.needsUpdate = true;

        const targetX = player.position.x + 4;
        camera.position.x += (targetX - camera.position.x) * Math.min(1, dt * 3.5);
        camera.position.y += (player.position.y + 5 - camera.position.y) * Math.min(1, dt * 2.3);
        camera.position.z = 14;
        camera.lookAt(camera.position.x + 3, camera.position.y - 1.8, 0);
        sun.position.x = camera.position.x - 12;
        sun.target.position.set(camera.position.x, 0, 0);
        updateHud();
        renderer.render(scene, camera);
      }

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      camera.position.set(3, 7, 14);
      restart();
      animate();
    })();
  </script>
  <script src="fps-counter.js"></script>
</body>
</html>
