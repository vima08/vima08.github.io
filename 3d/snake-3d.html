<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Snake</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#071311}#game{position:fixed;inset:0}.hud{position:fixed;z-index:2;top:16px;left:16px;width:min(390px,calc(100vw - 32px));padding:15px 18px;border:1px solid #65ffd855;border-radius:14px;background:#061411cc;backdrop-filter:blur(8px)}h1{margin:0 0 7px;font-size:24px}p{margin:6px 0;color:#c8eee5;line-height:1.35}#status{color:#fff;font-weight:bold}a{color:#75ffdd}</style></head>
<body><div id="game"></div><section class="hud"><h1>3D Snake</h1><p>Turn: Arrow keys or W A S D &nbsp; Reset: R</p><p>Collect the golden cubes and avoid the walls and your tail.</p><p id="status"></p><p><a href="/index.html">← Back to games</a></p></section>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const SIZE=17,scene=new THREE.Scene();scene.background=new THREE.Color(0x071311);scene.fog=new THREE.Fog(0x071311,24,45);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,20,20);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd8fff4,0x092019,1.6));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-8,18,10);light.castShadow=true;scene.add(light);
const floor=new THREE.Mesh(new THREE.BoxGeometry(SIZE+.8,.5,SIZE+.8),new THREE.MeshStandardMaterial({color:0x123d34,roughness:.72}));floor.position.y=-.45;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(SIZE,SIZE,0x63d9b9,0x245a4d);grid.position.y=-.18;scene.add(grid);const wallMat=new THREE.MeshStandardMaterial({color:0x286c5b,metalness:.25});[[0,-9,18,.45],[0,9,18,.45],[-9,0,.45,18],[9,0,.45,18]].forEach(([x,z,w,d])=>{const wall=new THREE.Mesh(new THREE.BoxGeometry(w,.7,d),wallMat);wall.position.set(x,.1,z);scene.add(wall)});
const snakeMat=new THREE.MeshStandardMaterial({color:0x5dffb1,emissive:0x0b5c39}),headMat=new THREE.MeshStandardMaterial({color:0xb2ffe0,emissive:0x16704d}),food=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0xffca45,emissive:0x8a4c00}));food.position.y=.45;food.castShadow=true;scene.add(food);let snake=[],meshes=[],dir={x:1,z:0},nextDir={x:1,z:0},score=0,ended=false,lastStep=0;const status=document.getElementById('status');function update(msg='Hunting for cubes'){status.textContent=`Score: ${score} | Length: ${snake.length} | ${msg}`};function cellMesh(head){const m=new THREE.Mesh(new THREE.BoxGeometry(.82,.82,.82),head?headMat:snakeMat);m.position.y=.35;m.castShadow=true;scene.add(m);return m}function spawnFood(){let x,z;do{x=Math.floor(Math.random()*SIZE)-8;z=Math.floor(Math.random()*SIZE)-8}while(snake.some(p=>p.x===x&&p.z===z));food.position.set(x,.45,z)}function sync(){while(meshes.length<snake.length)meshes.push(cellMesh(meshes.length===0));meshes.forEach((m,i)=>{m.position.x=snake[i].x;m.position.z=snake[i].z;m.rotation.y+=i===0?.08:.025})}function reset(){meshes.forEach(m=>scene.remove(m));meshes=[];snake=[{x:0,z:0},{x:-1,z:0},{x:-2,z:0}];dir={x:1,z:0};nextDir={x:1,z:0};score=0;ended=false;lastStep=performance.now();spawnFood();sync();update()}
function turn(x,z){if(x!==-dir.x||z!==-dir.z)nextDir={x,z}}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0);if(k==='r')reset()});reset();
function animate(t){requestAnimationFrame(animate);food.rotation.y+=.025;food.rotation.x+=.012;if(!ended&&t-lastStep>Math.max(90,210-score*2)){dir=nextDir;const head={x:snake[0].x+dir.x,z:snake[0].z+dir.z};if(Math.abs(head.x)>8||Math.abs(head.z)>8||snake.some(p=>p.x===head.x&&p.z===head.z)){ended=true;update('Game over — press R')}else{snake.unshift(head);if(head.x===food.position.x&&head.z===food.position.z){score+=10;spawnFood();update('Cube collected!')}else snake.pop();sync()}lastStep=t}camera.position.x+=((snake[0]?.x||0)*.15-camera.position.x)*.015;camera.lookAt((snake[0]?.x||0)*.08,0,(snake[0]?.z||0)*.08);renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate(0);
</script><script src="fps-counter.js"></script></body></html>
