<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids: Deep Space 3D</title>
  <link rel="icon" href="/favicons/asteroids-3d.svg" type="image/svg+xml" />
  <style>
    *{box-sizing:border-box}body{margin:0;overflow:hidden;background:#03050d;color:#eef5ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}#game{position:fixed;inset:0;background:radial-gradient(circle at 50% 48%,#14162d 0,#050711 58%,#02030a 100%)}canvas{display:block}.hud{position:fixed;inset:0;z-index:2;pointer-events:none}.brand{position:absolute;top:26px;left:30px}.eyebrow{color:#72e4ff;font-size:10px;font-weight:800;letter-spacing:.28em;text-transform:uppercase}.brand h1{margin:5px 0 0;font-size:clamp(21px,3vw,34px);font-weight:800;letter-spacing:-.04em;text-shadow:0 0 28px #557cff88}.brand h1 span{font-weight:300;color:#8290ad}.stats{position:absolute;top:28px;right:30px;display:flex;gap:8px}.stat{min-width:88px;padding:10px 14px;border:1px solid #8da8ff28;border-radius:10px;background:#080c1ba8;box-shadow:inset 0 1px #ffffff0d;backdrop-filter:blur(12px)}.stat label{display:block;color:#7785a6;font-size:9px;font-weight:700;letter-spacing:.18em}.stat b{display:block;margin-top:3px;font-size:18px;font-variant-numeric:tabular-nums}.stat b.cyan{color:#77eaff}.controls{position:absolute;left:30px;bottom:26px;color:#78839d;font-size:11px;letter-spacing:.08em}.key{display:inline-grid;min-width:23px;height:23px;margin:0 3px;place-items:center;border:1px solid #8ca1ca40;border-radius:5px;background:#11172bbb;color:#cbd7f0;font-weight:700}.back{position:absolute;right:30px;bottom:26px;pointer-events:auto;color:#8090b0;font-size:12px;text-decoration:none}.back:hover{color:#72e4ff}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 140px #000b;pointer-events:none}.message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;opacity:0;transform:scale(.95);transition:.3s}.message.show{opacity:1;transform:scale(1)}.message h2{margin:0;font-size:clamp(38px,7vw,78px);letter-spacing:-.06em;text-shadow:0 0 45px #667aff}.message p{color:#91a0bd;letter-spacing:.12em}.bar{position:absolute;left:50%;bottom:28px;width:min(300px,42vw);transform:translateX(-50%)}.bar header{display:flex;justify-content:space-between;margin-bottom:7px;color:#6f7d9c;font-size:9px;letter-spacing:.18em}.track{height:3px;background:#202843}.fill{width:100%;height:100%;background:linear-gradient(90deg,#55d8ff,#8a6cff);box-shadow:0 0 12px #62ceff;transition:width .2s}@media(max-width:650px){.brand{top:18px;left:18px}.stats{top:78px;left:18px;right:auto}.stat{min-width:75px;padding:8px}.controls{left:18px}.back{right:18px}}
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hud">
    <div class="brand"><div class="eyebrow">Sector // A–07</div><h1>ASTEROIDS <span>DEEP SPACE</span></h1></div>
    <div class="stats"><div class="stat"><label>SCORE</label><b id="score">000000</b></div><div class="stat"><label>WAVE</label><b id="wave" class="cyan">01</b></div><div class="stat"><label>HULL</label><b id="lives">◆ ◆ ◆</b></div></div>
    <div class="bar"><header><span>PLASMA DRIVE</span><span id="boostText">100%</span></header><div class="track"><div class="fill" id="boost"></div></div></div>
    <div class="controls"><span class="key">W</span><span class="key">A</span><span class="key">D</span> PILOT &nbsp;&nbsp; <span class="key">SPACE</span> FIRE &nbsp;&nbsp; <span class="key">⇧</span> BOOST</div>
    <a class="back" href="/index.html">← RETURN TO ARCADE</a><div class="message" id="message"><h2 id="messageTitle">WAVE 01</h2><p id="messageText">CLEAR THE SECTOR</p></div><div class="vignette"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  (()=>{
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);
    camera.position.set(0,28,22);camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.querySelector('#game').appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0x8ca9ff,0x080916,1.5));const sun=new THREE.DirectionalLight(0xa9c8ff,3);sun.position.set(-8,18,10);scene.add(sun);const rim=new THREE.PointLight(0x6d44ff,30,45);rim.position.set(10,5,-12);scene.add(rim);
    const field=new THREE.BufferGeometry(),stars=[];for(let i=0;i<900;i++)stars.push((Math.random()-.5)*100,(Math.random()-.5)*10-4,(Math.random()-.5)*100);field.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(field,new THREE.PointsMaterial({color:0xaac7ff,size:.075,transparent:true,opacity:.75})));
    const dust=[];for(let i=0;i<45;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.02+Math.random()*.035,0),new THREE.MeshBasicMaterial({color:0x668cff}));m.position.set((Math.random()-.5)*42,-.3,(Math.random()-.5)*34);scene.add(m);dust.push(m)}
    const ship=new THREE.Group(),metal=new THREE.MeshStandardMaterial({color:0x9aa9c5,metalness:.88,roughness:.26}),dark=new THREE.MeshStandardMaterial({color:0x11182a,metalness:.75,roughness:.3}),glow=new THREE.MeshBasicMaterial({color:0x66dfff});
    const hull=new THREE.Mesh(new THREE.ConeGeometry(.72,2.8,5),metal);hull.rotation.x=Math.PI/2;const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.39,16,8),dark);cockpit.scale.set(1,.55,1.35);cockpit.position.set(0,.32,-.18);const wingGeo=new THREE.BoxGeometry(2.5,.12,.75);const wings=new THREE.Mesh(wingGeo,metal);wings.position.z=.45;const engine=new THREE.Mesh(new THREE.ConeGeometry(.27,1.3,12,1,true),glow);engine.rotation.x=-Math.PI/2;engine.position.z=1.9;ship.add(hull,cockpit,wings,engine);scene.add(ship);
    const keys=new Set(),asteroids=[],shots=[],particles=[];let velocity=new THREE.Vector2(),score=0,wave=1,lives=3,boost=100,invulnerable=0,ended=false,lastShot=0;
    const bounds={x:18,z:14};
    function irregularGeometry(size,seed){const g=new THREE.IcosahedronGeometry(size,1),p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),n=1+Math.sin(i*12.9898+seed*7.1)*.16+Math.cos(i*4.31+seed)*.09;p.setXYZ(i,x*n,y*n,z*n)}g.computeVertexNormals();return g}
    function makeAsteroid(size,x,z){const mat=new THREE.MeshStandardMaterial({color:size>1.2?0x3a4054:0x454b61,roughness:.91,metalness:.08,flatShading:true});const a=new THREE.Mesh(irregularGeometry(size,Math.random()*50),mat);a.position.set(x,(Math.random()-.5)*.7,z);a.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);const angle=Math.random()*Math.PI*2,speed=(.018+Math.random()*.022)*(2.2/size);a.userData={size,vx:Math.cos(angle)*speed,vz:Math.sin(angle)*speed,spin:(Math.random()-.5)*.018,radius:size*.82};scene.add(a);asteroids.push(a)}
    function safeSpawn(size){let x,z;do{x=(Math.random()-.5)*bounds.x*2;z=(Math.random()-.5)*bounds.z*2}while(Math.hypot(x-ship.position.x,z-ship.position.z)<7);makeAsteroid(size,x,z)}
    function burst(pos,color=0x78ddff,count=14){for(let i=0;i<count;i++){const p=new THREE.Mesh(new THREE.IcosahedronGeometry(.04+Math.random()*.09,0),new THREE.MeshBasicMaterial({color,transparent:true}));p.position.copy(pos);p.userData={v:new THREE.Vector3((Math.random()-.5)*.18,Math.random()*.08,(Math.random()-.5)*.18),life:1};scene.add(p);particles.push(p)}}
    function wrap(o){if(o.position.x>bounds.x)o.position.x=-bounds.x;if(o.position.x<-bounds.x)o.position.x=bounds.x;if(o.position.z>bounds.z)o.position.z=-bounds.z;if(o.position.z<-bounds.z)o.position.z=bounds.z}
    function spawnWave(){for(let i=0;i<3+wave;i++)safeSpawn(1.5+Math.random()*.8);flash(`WAVE ${String(wave).padStart(2,'0')}`,'CLEAR THE SECTOR')}
    function flash(title,text,stay=false){messageTitle.textContent=title;messageText.textContent=text;message.classList.add('show');if(!stay)setTimeout(()=>message.classList.remove('show'),1100)}
    function shoot(t){if(t-lastShot<170||ended)return;lastShot=t;const dir=new THREE.Vector2(-Math.sin(ship.rotation.y),-Math.cos(ship.rotation.y)),s=new THREE.Mesh(new THREE.CapsuleGeometry(.045,.6,3,6),new THREE.MeshBasicMaterial({color:0x7fe9ff}));s.rotation.x=Math.PI/2;s.rotation.z=-ship.rotation.y;s.position.copy(ship.position);s.position.x+=dir.x;s.position.z+=dir.y;s.userData={vx:dir.x*.42+velocity.x,vz:dir.y*.42+velocity.y,life:75};scene.add(s);shots.push(s)}
    function hitAsteroid(a,index){const size=a.userData.size;score+=size>1.2?100:250;burst(a.position,0xa9b5d1,size>1.2?16:8);if(size>1.2)for(let j=0;j<2;j++)makeAsteroid(size*.53,a.position.x+(Math.random()-.5),a.position.z+(Math.random()-.5));scene.remove(a);asteroids.splice(index,1)}
    function reset(){asteroids.concat(shots,particles).forEach(o=>scene.remove(o));asteroids.length=shots.length=particles.length=0;score=0;wave=1;lives=3;boost=100;ended=false;invulnerable=100;velocity.set(0,0);ship.position.set(0,0,0);ship.rotation.y=0;message.classList.remove('show');spawnWave()}
    addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();shoot(performance.now())}if(e.key.toLowerCase()==='r'&&ended)reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
    function animate(t){requestAnimationFrame(animate);if(!ended){const turn=(keys.has('a')||keys.has('arrowleft')?1:0)-(keys.has('d')||keys.has('arrowright')?1:0);ship.rotation.y+=turn*.055;const thrust=keys.has('w')||keys.has('arrowup'),boosting=thrust&&keys.has('shift')&&boost>0,mult=boosting?2.15:1;if(thrust){velocity.x-=Math.sin(ship.rotation.y)*.006*mult;velocity.y-=Math.cos(ship.rotation.y)*.006*mult;engine.scale.z=1.1+Math.random()*(boosting?1.8:.7);if(boosting)boost-=.45}else engine.scale.z=.65;boost=Math.min(100,boost+.09);velocity.multiplyScalar(.992);velocity.clampLength(0,boosting?.24:.13);ship.position.x+=velocity.x;ship.position.z+=velocity.y;wrap(ship);ship.rotation.z=-turn*.18;ship.position.y=Math.sin(t*.004)*.08;if(keys.has(' '))shoot(t);if(invulnerable>0){invulnerable--;ship.visible=Math.floor(invulnerable/5)%2===0}else ship.visible=true;
      asteroids.forEach(a=>{a.position.x+=a.userData.vx;a.position.z+=a.userData.vz;a.rotation.x+=a.userData.spin;a.rotation.y+=a.userData.spin*.7;wrap(a)});shots.forEach(s=>{s.position.x+=s.userData.vx;s.position.z+=s.userData.vz;s.userData.life--;wrap(s)});
      for(let i=shots.length-1;i>=0;i--){let used=shots[i].userData.life<0;for(let j=asteroids.length-1;j>=0&&!used;j--)if(shots[i].position.distanceTo(asteroids[j].position)<asteroids[j].userData.radius){hitAsteroid(asteroids[j],j);used=true}if(used){scene.remove(shots[i]);shots.splice(i,1)}}
      if(!invulnerable)for(const a of asteroids)if(ship.position.distanceTo(a.position)<a.userData.radius+.55){lives--;invulnerable=130;velocity.multiplyScalar(-1);burst(ship.position,0x65dcff,24);if(!lives){ended=true;ship.visible=false;flash('SHIP LOST',`SCORE ${String(score).padStart(6,'0')} · PRESS R TO RESTART`,true)}break}
      if(!asteroids.length){wave++;spawnWave()}}
      for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.position.add(p.userData.v);p.userData.life-=.025;p.scale.setScalar(p.userData.life);p.material.opacity=p.userData.life;if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}dust.forEach(d=>{d.position.z+=.006;if(d.position.z>17)d.position.z=-17});scoreEl.textContent=String(score).padStart(6,'0');waveEl.textContent=String(wave).padStart(2,'0');livesEl.textContent='◆ '.repeat(lives).trim()||'—';boostEl.style.width=boost+'%';boostText.textContent=Math.round(boost)+'%';camera.position.x+=(ship.position.x*.08-camera.position.x)*.02;camera.lookAt(camera.position.x*.2,0,0);renderer.render(scene,camera)}
    const scoreEl=document.querySelector('#score'),waveEl=document.querySelector('#wave'),livesEl=document.querySelector('#lives'),boostEl=document.querySelector('#boost'),boostText=document.querySelector('#boostText'),message=document.querySelector('#message'),messageTitle=document.querySelector('#messageTitle'),messageText=document.querySelector('#messageText');reset();animate(0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
  })();
  </script>
  <script src="fps-counter.js"></script>
</body></html>
