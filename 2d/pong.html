<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пинг-Понг — Neon Rally</title>
  <link rel="icon" href="/favicons/pong.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --cyan: #5ff7ff; --pink: #ff5ccf; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow-x: hidden; color: #eafcff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, #183758 0, transparent 32%),
        radial-gradient(circle at 82% 78%, #421b52 0, transparent 34%),
        linear-gradient(145deg, #050914, #090719 70%);
    }
    .game-shell { width: min(100%, 1040px); padding: clamp(14px, 3vw, 30px); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 42px); letter-spacing: -.04em; }
    h1 span { color: var(--cyan); text-shadow: 0 0 22px #5ff7ff88; }
    .round { color: #97a9bd; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
    .canvas-wrap {
      position: relative; padding: 1px; border-radius: 22px;
      background: linear-gradient(120deg, #5ff7ff99, #ffffff12 42%, #ff5ccf99);
      box-shadow: 0 28px 80px #000a, 0 0 42px #5ff7ff18;
    }
    canvas { display: block; width: 100%; height: auto; border-radius: 21px; touch-action: none; }
    .help { display: flex; justify-content: space-between; gap: 20px; margin: 13px 4px 0; color: #8fa3b8; font-size: 13px; }
    kbd { padding: 2px 7px; border: 1px solid #30445b; border-bottom-width: 2px; border-radius: 6px; color: #eaffff; background: #111a29; }
    @media (max-width: 620px) { header { align-items: start; flex-direction: column; } .help { flex-direction: column; gap: 7px; } }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>NEON <span>RALLY</span></h1>
      <div class="round" id="roundLabel">Матч до 7 очков</div>
    </header>
    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="960" height="540" aria-label="Пинг-понг для двух игроков"></canvas>
    </div>
    <div class="help">
      <span>Игрок 1: <kbd>W</kbd> <kbd>S</kbd> · Игрок 2: <kbd>↑</kbd> <kbd>↓</kbd></span>
      <span><kbd>P</kbd> пауза · <kbd>R</kbd> новый матч</span>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const roundLabel = document.getElementById('roundLabel');
    const W = canvas.width;
    const H = canvas.height;

    const SETTINGS = {
      targetScore: 7,
      paddleSpeed: 520,
      serveSpeed: 390,
      maxBallSpeed: 820,
      maxBounceAngle: Math.PI / 3,
      serveDelay: 0.8
    };

    const left = { x: 42, y: H / 2 - 55, w: 16, h: 110, score: 0, color: '#5ff7ff' };
    const right = { x: W - 58, y: H / 2 - 55, w: 16, h: 110, score: 0, color: '#ff5ccf' };
    const ball = { x: W / 2, y: H / 2, r: 10, vx: 0, vy: 0, trail: [] };
    const keys = new Set();
    const particles = [];
    let serveTimer = SETTINGS.serveDelay;
    let nextServeDirection = Math.random() < 0.5 ? -1 : 1;
    let winner = null;
    let paused = false;
    let lastTime = performance.now();

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const random = (min, max) => min + Math.random() * (max - min);

    function resetBall(direction) {
      ball.x = W / 2;
      ball.y = H / 2 + random(-55, 55);
      ball.vx = 0;
      ball.vy = 0;
      ball.trail.length = 0;
      nextServeDirection = direction;
      serveTimer = SETTINGS.serveDelay;
    }

    function resetMatch() {
      left.score = 0;
      right.score = 0;
      winner = null;
      paused = false;
      left.y = right.y = H / 2 - left.h / 2;
      resetBall(Math.random() < 0.5 ? -1 : 1);
      roundLabel.textContent = `Матч до ${SETTINGS.targetScore} очков`;
    }

    function launchBall() {
      const angle = random(-0.42, 0.42);
      ball.vx = Math.cos(angle) * SETTINGS.serveSpeed * nextServeDirection;
      ball.vy = Math.sin(angle) * SETTINGS.serveSpeed;
    }

    function scorePoint(player, direction) {
      player.score += 1;
      burst(W / 2, H / 2, player.color, 32, 230);
      if (player.score >= SETTINGS.targetScore) {
        winner = player;
        ball.vx = ball.vy = 0;
        roundLabel.textContent = player === left ? 'Победил игрок 1' : 'Победил игрок 2';
      } else {
        resetBall(direction);
      }
    }

    function burst(x, y, color, amount, speed) {
      for (let i = 0; i < amount; i += 1) {
        const angle = random(0, Math.PI * 2);
        const force = random(speed * 0.35, speed);
        particles.push({ x, y, vx: Math.cos(angle) * force, vy: Math.sin(angle) * force, life: random(.25, .7), size: random(2, 5), color });
      }
    }

    function movePaddle(paddle, direction, dt) {
      paddle.y = clamp(paddle.y + direction * SETTINGS.paddleSpeed * dt, 18, H - 18 - paddle.h);
    }

    function resolvePaddleHit(paddle, direction) {
      const overlapsX = ball.x + ball.r > paddle.x && ball.x - ball.r < paddle.x + paddle.w;
      const overlapsY = ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h;
      const movingTowardPaddle = Math.sign(ball.vx) === direction;
      if (!overlapsX || !overlapsY || !movingTowardPaddle) return;

      const relativeHit = clamp((ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2), -1, 1);
      const currentSpeed = Math.hypot(ball.vx, ball.vy);
      const nextSpeed = Math.min(currentSpeed * 1.045 + 7, SETTINGS.maxBallSpeed);
      const angle = relativeHit * SETTINGS.maxBounceAngle;

      // Для геймдизайнера: точка контакта управляет углом отскока — игрок может целиться краями ракетки.
      ball.vx = Math.cos(angle) * nextSpeed * -direction;
      ball.vy = Math.sin(angle) * nextSpeed;
      ball.x = direction < 0 ? paddle.x + paddle.w + ball.r : paddle.x - ball.r;
      burst(ball.x, ball.y, paddle.color, 10, 150);
    }

    function updateBall(dt) {
      if (winner) return;
      if (serveTimer > 0) {
        serveTimer -= dt;
        if (serveTimer <= 0) launchBall();
        return;
      }

      // Для программиста: адаптивные подшаги не дают быстрому мячу «пролететь» сквозь тонкую ракетку.
      const substeps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / ball.r));
      const step = dt / substeps;
      for (let i = 0; i < substeps; i += 1) {
        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        if (ball.y - ball.r <= 16 && ball.vy < 0) {
          ball.y = 16 + ball.r;
          ball.vy *= -1;
          burst(ball.x, ball.y, '#ffffff', 5, 90);
        } else if (ball.y + ball.r >= H - 16 && ball.vy > 0) {
          ball.y = H - 16 - ball.r;
          ball.vy *= -1;
          burst(ball.x, ball.y, '#ffffff', 5, 90);
        }

        resolvePaddleHit(left, -1);
        resolvePaddleHit(right, 1);
      }

      if (ball.x + ball.r < 0) scorePoint(right, -1);
      if (ball.x - ball.r > W) scorePoint(left, 1);
      if (ball.vx || ball.vy) ball.trail.unshift({ x: ball.x, y: ball.y });
      ball.trail.length = Math.min(ball.trail.length, 12);
    }

    function update(dt) {
      const leftDirection = (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0);
      const rightDirection = (keys.has('arrowdown') ? 1 : 0) - (keys.has('arrowup') ? 1 : 0);
      movePaddle(left, leftDirection, dt);
      movePaddle(right, rightDirection, dt);
      updateBall(dt);

      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= Math.pow(.04, dt);
        particle.vy *= Math.pow(.04, dt);
        particle.life -= dt;
      }
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function drawArena(time) {
      const backdrop = ctx.createLinearGradient(0, 0, W, H);
      backdrop.addColorStop(0, '#071c30');
      backdrop.addColorStop(.48, '#080d1c');
      backdrop.addColorStop(1, '#24102c');
      ctx.fillStyle = backdrop;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = .16;
      ctx.strokeStyle = '#66dfea';
      ctx.lineWidth = 1;
      const drift = (time * .012) % 48;
      for (let x = -48 + drift; x < W + 48; x += 48) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 16; y < H; y += 48) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#bdeaff33';
      ctx.lineWidth = 2;
      ctx.strokeRect(16, 16, W - 32, H - 32);
      ctx.setLineDash([15, 17]);
      ctx.strokeStyle = '#e9fbff55';
      ctx.beginPath(); ctx.moveTo(W / 2, 30); ctx.lineTo(W / 2, H - 30); ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.save();
      ctx.shadowColor = paddle.color;
      ctx.shadowBlur = 24;
      const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(.38, paddle.color);
      gradient.addColorStop(1, '#3d7891');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
      ctx.fill();
      ctx.globalAlpha = .55;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(paddle.x + 3, paddle.y + 13, 2, paddle.h - 26);
      ctx.restore();
    }

    function drawBall() {
      ball.trail.forEach((point, index) => {
        const alpha = (1 - index / ball.trail.length) * .24;
        ctx.fillStyle = `rgba(196, 249, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(point.x, point.y, Math.max(1, ball.r - index * .55), 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.save();
      ctx.shadowColor = '#bdfaff';
      ctx.shadowBlur = 28;
      const glow = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 1, ball.x, ball.y, ball.r);
      glow.addColorStop(0, '#ffffff');
      glow.addColorStop(.45, '#bdfaff');
      glow.addColorStop(1, '#4aa9dc');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawHud() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 62px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#5ff7ff'; ctx.fillText(left.score, W / 2 - 80, 72);
      ctx.fillStyle = '#ff5ccf'; ctx.fillText(right.score, W / 2 + 80, 72);
      ctx.font = '700 12px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#9fb3c9'; ctx.fillText('P1', W / 2 - 80, 111); ctx.fillText('P2', W / 2 + 80, 111);

      if (serveTimer > 0 && !winner) {
        ctx.font = '700 15px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#d8faff';
        ctx.fillText('ПОДАЧА', W / 2, H / 2 - 35);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff33';
        ctx.beginPath(); ctx.arc(W / 2, H / 2, 25, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#5ff7ff';
        ctx.beginPath(); ctx.arc(W / 2, H / 2, 25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - serveTimer / SETTINGS.serveDelay)); ctx.stroke();
      }

      if (winner || paused) {
        ctx.fillStyle = '#030711c9'; ctx.fillRect(0, 0, W, H);
        ctx.font = '900 52px Inter, system-ui, sans-serif';
        ctx.fillStyle = winner ? winner.color : '#ffffff';
        ctx.fillText(winner ? (winner === left ? 'ИГРОК 1 ПОБЕДИЛ' : 'ИГРОК 2 ПОБЕДИЛ') : 'ПАУЗА', W / 2, H / 2 - 18);
        ctx.font = '500 17px Inter, system-ui, sans-serif';
        ctx.fillStyle = '#b8c7d8';
        ctx.fillText(winner ? 'Нажмите R, чтобы начать новый матч' : 'Нажмите P, чтобы продолжить', W / 2, H / 2 + 36);
      }
      ctx.textAlign = 'left';
    }

    function draw(time) {
      drawArena(time);
      drawPaddle(left);
      drawPaddle(right);
      for (const particle of particles) {
        ctx.globalAlpha = clamp(particle.life * 2.5, 0, 1);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
      drawBall();
      drawHud();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, .033);
      lastTime = now;
      if (!paused) update(dt);
      draw(now);
      requestAnimationFrame(gameLoop);
    }

    addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (['w', 's', 'arrowup', 'arrowdown', 'p', 'r'].includes(key)) event.preventDefault();
      if (key === 'p' && !winner && !event.repeat) paused = !paused;
      if (key === 'r' && !event.repeat) resetMatch();
      keys.add(key);
    });
    addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
    addEventListener('blur', () => keys.clear());

    resetMatch();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
