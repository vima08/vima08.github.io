<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>White Cube Platformer</title>
    <link rel="icon" href="/favicons/platformer.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #eaf7ff;
        --muted: #9ab3ca;
        --cyan: #65f5dc;
        --violet: #8d7cff;
        --panel: rgba(7, 14, 29, 0.76);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 12px 116px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 12%, rgba(93, 95, 255, 0.22), transparent 28rem),
          radial-gradient(circle at 82% 92%, rgba(24, 226, 196, 0.12), transparent 30rem),
          #060914;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      main { width: min(940px, 100%); }

      .masthead {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin: 0 4px 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 48px);
        line-height: 0.95;
        letter-spacing: -0.055em;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      a { color: #b7c9ff; text-decoration: none; }
      a:hover { color: #fff; }

      .game-shell {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(148, 182, 255, 0.35);
        border-radius: 22px;
        background: rgba(6, 12, 25, 0.75);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.035) inset;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #0d1830;
        touch-action: none;
      }

      .motion-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
      }

      button {
        border: 1px solid rgba(153, 190, 255, 0.38);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(42, 61, 105, 0.95), rgba(23, 34, 64, 0.95));
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24), 0 1px rgba(255, 255, 255, 0.1) inset;
        color: #fff;
        cursor: pointer;
        font: 700 13px/1 system-ui, sans-serif;
      }

      button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

      #motionBtn { padding: 10px 15px; }
      #motionStatus { margin: 0; color: var(--muted); font-size: 13px; }

      .controls-panel {
        margin-top: 10px;
        padding: 11px 14px;
        border: 1px solid rgba(149, 177, 228, 0.18);
        border-radius: 13px;
        background: var(--panel);
        color: var(--muted);
        font-size: 14px;
      }

      .controls-panel summary { color: #dceaff; cursor: pointer; font-weight: 750; }
      .controls-panel p { margin: 8px 0 2px; }

      .mobile-controls {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        padding: 0 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
        pointer-events: none;
      }

      .mobile-btn {
        width: 82px;
        height: 82px;
        padding: 0;
        border-color: rgba(205, 235, 255, 0.66);
        background: rgba(12, 24, 47, 0.74);
        backdrop-filter: blur(12px);
        pointer-events: auto;
        touch-action: none;
      }

      .mobile-btn:active, .mobile-btn.is-active { transform: scale(0.94); background: rgba(76, 103, 173, 0.84); }

      @media (pointer: fine) and (min-width: 760px) {
        body { padding-bottom: 28px; }
        .mobile-controls { display: none; }
      }

      @media (max-width: 620px) {
        .masthead { align-items: start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="masthead">
        <div>
          <p class="eyebrow">Neon ruins · 3 stages</p>
          <h1>White Cube</h1>
        </div>
        <a href="/index.html" aria-label="Back to game collection">← Back to Index</a>
      </header>

      <section class="game-shell" aria-label="White Cube Platformer game">
        <canvas id="gameCanvas" width="900" height="440"></canvas>
      </section>

      <div class="motion-row">
        <button id="motionBtn" type="button">Enable tilt controls</button>
        <p id="motionStatus" aria-live="polite">Tilt: off</p>
      </div>

      <details class="controls-panel">
        <summary>Controls & tips</summary>
        <p>Move: ← → or A / D. Jump: Space. Shoot: Ctrl. Tilt is available on mobile.</p>
        <p>Release jump early for a shorter arc. Reach the glowing exit; red sentries reset your run.</p>
      </details>
    </main>

    <div class="mobile-controls" aria-label="Mobile controls">
      <button class="mobile-btn" id="shootBtn" type="button">SHOOT</button>
      <button class="mobile-btn" id="jumpBtn" type="button">JUMP</button>
    </div>

    <script>
      'use strict';

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const motionStatusEl = document.getElementById('motionStatus');
      const motionBtn = document.getElementById('motionBtn');
      const jumpBtn = document.getElementById('jumpBtn');
      const shootBtn = document.getElementById('shootBtn');

      const TUNING = Object.freeze({
        gravity: 1800,
        moveSpeed: 320,
        acceleration: 2400,
        jumpSpeed: 770,
        bulletSpeed: 680,
        shootCooldown: 0.16,
        maxAmmo: 3,
        maxTilt: 30,
        coyoteTime: 0.1,
        jumpBuffer: 0.11,
      });

      const LEVELS = [
        {
          worldWidth: 2600,
          start: { x: 80, y: 220 },
          platforms: [
            { x: 0, y: 394, w: 300, h: 46 }, { x: 220, y: 332, w: 150, h: 20 },
            { x: 470, y: 278, w: 160, h: 20 }, { x: 690, y: 228, w: 170, h: 20 },
            { x: 980, y: 300, w: 180, h: 20 }, { x: 1240, y: 256, w: 140, h: 20 },
            { x: 1460, y: 214, w: 180, h: 20 }, { x: 1740, y: 270, w: 200, h: 20 },
            { x: 2060, y: 330, w: 180, h: 20 }, { x: 2340, y: 394, w: 260, h: 46 },
          ],
          enemies: [
            { x: 280, speed: 95, dir: 1, platform: 1, leftPad: 8, rightPad: 8 },
            { x: 520, speed: 115, dir: -1, platform: 2, leftPad: 10, rightPad: 10 },
            { x: 760, speed: 100, dir: 1, platform: 3, leftPad: 8, rightPad: 8 },
            { x: 1520, speed: 120, dir: -1, platform: 6, leftPad: 10, rightPad: 10 },
            { x: 2115, speed: 105, dir: 1, platform: 8, leftPad: 8, rightPad: 8 },
          ],
        },
        {
          worldWidth: 2550,
          start: { x: 80, y: 200 },
          platforms: [
            { x: 0, y: 394, w: 260, h: 46 }, { x: 230, y: 344, w: 120, h: 20 },
            { x: 390, y: 292, w: 140, h: 20 }, { x: 590, y: 250, w: 120, h: 20 },
            { x: 760, y: 210, w: 120, h: 20 }, { x: 940, y: 252, w: 140, h: 20 },
            { x: 1140, y: 300, w: 150, h: 20 }, { x: 1360, y: 260, w: 160, h: 20 },
            { x: 1600, y: 222, w: 150, h: 20 }, { x: 1820, y: 282, w: 180, h: 20 },
            { x: 2100, y: 340, w: 180, h: 20 }, { x: 2290, y: 394, w: 260, h: 46 },
          ],
          enemies: [
            { x: 260, speed: 100, dir: 1, platform: 1, leftPad: 6, rightPad: 6 },
            { x: 420, speed: 130, dir: -1, platform: 2, leftPad: 8, rightPad: 8 },
            { x: 810, speed: 112, dir: 1, platform: 4, leftPad: 8, rightPad: 8 },
            { x: 1420, speed: 125, dir: -1, platform: 7, leftPad: 8, rightPad: 8 },
            { x: 1890, speed: 120, dir: 1, platform: 9, leftPad: 8, rightPad: 8 },
            { x: 2140, speed: 108, dir: -1, platform: 10, leftPad: 8, rightPad: 8 },
          ],
        },
        {
          worldWidth: 2700,
          start: { x: 80, y: 210 },
          platforms: [
            { x: 0, y: 394, w: 300, h: 46 }, { x: 250, y: 320, w: 120, h: 20 },
            { x: 420, y: 260, w: 110, h: 20 }, { x: 590, y: 210, w: 110, h: 20 },
            { x: 760, y: 260, w: 110, h: 20 }, { x: 930, y: 320, w: 130, h: 20 },
            { x: 1150, y: 270, w: 130, h: 20 }, { x: 1340, y: 220, w: 110, h: 20 },
            { x: 1510, y: 180, w: 110, h: 20 }, { x: 1690, y: 235, w: 130, h: 20 },
            { x: 1880, y: 290, w: 150, h: 20 }, { x: 2100, y: 340, w: 160, h: 20 },
            { x: 2360, y: 298, w: 160, h: 20 }, { x: 2510, y: 394, w: 190, h: 46 },
          ],
          enemies: [
            { x: 280, speed: 108, dir: 1, platform: 1, leftPad: 8, rightPad: 8 },
            { x: 445, speed: 124, dir: -1, platform: 2, leftPad: 8, rightPad: 8 },
            { x: 610, speed: 126, dir: 1, platform: 3, leftPad: 8, rightPad: 8 },
            { x: 960, speed: 135, dir: -1, platform: 5, leftPad: 8, rightPad: 8 },
            { x: 1370, speed: 120, dir: 1, platform: 7, leftPad: 8, rightPad: 8 },
            { x: 1910, speed: 110, dir: -1, platform: 10, leftPad: 8, rightPad: 8 },
            { x: 2400, speed: 132, dir: 1, platform: 12, leftPad: 8, rightPad: 8 },
          ],
        },
      ];

      const input = { left: false, right: false, jumpHeld: false };
      const player = {
        x: 80, y: 220, w: 28, h: 28, vx: 0, vy: 0,
        onGround: false, facing: 1, coyoteLeft: 0, jumpBufferLeft: 0, invulnerableLeft: 0,
      };
      const state = {
        levelIndex: 0, worldWidth: LEVELS[0].worldWidth, platforms: [], enemies: [],
        finishPlatform: null, bullets: [], particles: [], cameraX: 0, tilt: 0,
        shootCooldownLeft: 0, ammoLeft: TUNING.maxAmmo, levelComplete: false,
        gameComplete: false, flashLeft: 0, shakeLeft: 0,
      };

      let audioContext = null;

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function moveToward(value, target, maxDelta) {
        if (Math.abs(target - value) <= maxDelta) return target;
        return value + Math.sign(target - value) * maxDelta;
      }
      function intersects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function roundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
      }

      function playSynth(frequency, duration, type = 'square', volume = 0.035) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        audioContext ||= new AudioCtor();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(45, frequency * 0.48), audioContext.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      }

      function spawnParticles(x, y, color, amount = 10, speed = 150) {
        for (let i = 0; i < amount; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = speed * (0.35 + Math.random() * 0.65);
          state.particles.push({
            x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity,
            life: 0.35 + Math.random() * 0.35, maxLife: 0.7, size: 2 + Math.random() * 4, color,
          });
        }
      }

      function loadLevel(index) {
        const level = LEVELS[index];
        state.levelIndex = index;
        state.worldWidth = level.worldWidth;
        state.platforms = level.platforms.map((platform, platformIndex) => ({ ...platform, platformIndex }));
        state.finishPlatform = state.platforms.at(-1);
        state.enemies = level.enemies.map((enemy) => {
          const platform = state.platforms[enemy.platform];
          const width = 24;
          return {
            ...enemy, w: width, h: 24, y: platform.y - 24,
            minX: platform.x + enemy.leftPad,
            maxX: platform.x + platform.w - width - enemy.rightPad,
          };
        });
        state.bullets.length = 0;
        state.particles.length = 0;
        state.cameraX = 0;
        state.tilt = 0;
        state.shootCooldownLeft = 0;
        state.ammoLeft = TUNING.maxAmmo;
        state.levelComplete = false;
        state.gameComplete = false;
        resetPlayer(true);
      }

      function resetPlayer(initial = false) {
        if (state.levelComplete && !initial) return;
        const start = LEVELS[state.levelIndex].start;
        if (!initial) {
          spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff597d', 18, 220);
          state.flashLeft = 0.18;
          state.shakeLeft = 0.22;
          playSynth(125, 0.18, 'sawtooth', 0.045);
        }
        Object.assign(player, {
          x: start.x, y: start.y, vx: 0, vy: 0, onGround: false,
          facing: 1, coyoteLeft: 0, jumpBufferLeft: 0, invulnerableLeft: initial ? 0 : 0.65,
        });
        state.bullets.length = 0;
        // Для геймдизайнера: смерть возвращает три заряда — ошибка не может сделать уровень непроходимым.
        state.ammoLeft = TUNING.maxAmmo;
      }

      function completeLevel() {
        if (state.levelComplete) return;
        state.levelComplete = true;
        state.gameComplete = state.levelIndex === LEVELS.length - 1;
        input.left = false;
        input.right = false;
        setJumpDown(false);
        spawnParticles(player.x + player.w / 2, player.y, '#65f5dc', 32, 260);
        playSynth(520, 0.28, 'sine', 0.045);
      }

      function advanceLevel() {
        if (!state.levelComplete) return;
        loadLevel(state.gameComplete ? 0 : state.levelIndex + 1);
      }

      function setJumpDown(isDown) {
        if (isDown && !input.jumpHeld && !state.levelComplete) {
          player.jumpBufferLeft = TUNING.jumpBuffer;
        }
        // Для программиста: раннее отпускание кнопки гасит подъём — это переменная высота прыжка.
        if (!isDown && input.jumpHeld && player.vy < 0) player.vy *= 0.48;
        input.jumpHeld = isDown;
        jumpBtn.classList.toggle('is-active', isDown);
      }

      function tryShoot() {
        if (state.levelComplete || state.shootCooldownLeft > 0 || state.ammoLeft <= 0) return;
        const width = 12;
        state.bullets.push({
          x: player.facing > 0 ? player.x + player.w : player.x - width,
          y: player.y + player.h * 0.48,
          w: width, h: 4, vx: TUNING.bulletSpeed * player.facing,
        });
        state.shootCooldownLeft = TUNING.shootCooldown;
        state.ammoLeft -= 1;
        spawnParticles(player.x + player.w / 2 + player.facing * 18, player.y + player.h / 2, '#ffe48a', 4, 80);
        playSynth(330, 0.07, 'square', 0.025);
      }

      function resolvePlayerMovement(dt) {
        player.x += player.vx * dt;
        player.x = clamp(player.x, 0, state.worldWidth - player.w);
        for (const platform of state.platforms) {
          if (!intersects(player, platform)) continue;
          if (player.vx > 0) player.x = platform.x - player.w;
          else if (player.vx < 0) player.x = platform.x + platform.w;
          player.vx = 0;
        }

        const previousBottom = player.y + player.h;
        player.vy += TUNING.gravity * dt;
        player.y += player.vy * dt;
        player.onGround = false;

        for (const platform of state.platforms) {
          if (!intersects(player, platform)) continue;
          if (player.vy >= 0 && previousBottom <= platform.y + 1) {
            player.y = platform.y - player.h;
            player.vy = 0;
            player.onGround = true;
            if (platform === state.finishPlatform) completeLevel();
          } else if (player.vy < 0) {
            player.y = platform.y + platform.h;
            player.vy = 0;
          }
        }
      }

      function updateEffects(dt) {
        state.flashLeft = Math.max(0, state.flashLeft - dt);
        state.shakeLeft = Math.max(0, state.shakeLeft - dt);
        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const particle = state.particles[i];
          particle.life -= dt;
          if (particle.life <= 0) {
            state.particles.splice(i, 1);
            continue;
          }
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 260 * dt;
          particle.vx *= Math.pow(0.12, dt);
        }
      }

      function update(dt) {
        updateEffects(dt);
        if (state.levelComplete) return;

        state.shootCooldownLeft = Math.max(0, state.shootCooldownLeft - dt);
        player.invulnerableLeft = Math.max(0, player.invulnerableLeft - dt);
        player.jumpBufferLeft = Math.max(0, player.jumpBufferLeft - dt);
        player.coyoteLeft = player.onGround ? TUNING.coyoteTime : Math.max(0, player.coyoteLeft - dt);

        let moveInput = Number(input.right) - Number(input.left);
        const tiltInput = state.tilt / TUNING.maxTilt;
        if (Math.abs(tiltInput) > Math.abs(moveInput)) moveInput = tiltInput;
        const targetVelocity = moveInput * TUNING.moveSpeed;
        player.vx = moveToward(player.vx, targetVelocity, TUNING.acceleration * dt);
        if (Math.abs(player.vx) > 8) player.facing = Math.sign(player.vx);

        // Для геймдизайнера: coyote time и jump buffer прощают нажатие на несколько кадров раньше/позже края.
        if (player.jumpBufferLeft > 0 && player.coyoteLeft > 0) {
          player.vy = -TUNING.jumpSpeed;
          player.onGround = false;
          player.coyoteLeft = 0;
          player.jumpBufferLeft = 0;
          spawnParticles(player.x + player.w / 2, player.y + player.h, '#b8f7ff', 7, 95);
          playSynth(210, 0.08, 'sine', 0.018);
        }

        resolvePlayerMovement(dt);
        if (player.y > canvas.height + 160) resetPlayer();

        for (let bulletIndex = state.bullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
          const bullet = state.bullets[bulletIndex];
          bullet.x += bullet.vx * dt;
          if (bullet.x + bullet.w < 0 || bullet.x > state.worldWidth) state.bullets.splice(bulletIndex, 1);
        }

        for (let enemyIndex = state.enemies.length - 1; enemyIndex >= 0; enemyIndex -= 1) {
          const enemy = state.enemies[enemyIndex];
          enemy.x += enemy.speed * enemy.dir * dt;
          if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
            enemy.x = clamp(enemy.x, enemy.minX, enemy.maxX);
            enemy.dir *= -1;
          }

          let destroyed = false;
          for (let bulletIndex = state.bullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
            if (!intersects(state.bullets[bulletIndex], enemy)) continue;
            state.bullets.splice(bulletIndex, 1);
            state.enemies.splice(enemyIndex, 1);
            spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#ff597d', 14, 190);
            playSynth(150, 0.1, 'triangle', 0.03);
            destroyed = true;
            break;
          }
          if (!destroyed && player.invulnerableLeft <= 0 && intersects(player, enemy)) {
            resetPlayer();
            break;
          }
        }

        const targetCamera = player.x - canvas.width * 0.35;
        state.cameraX = moveToward(
          state.cameraX,
          clamp(targetCamera, 0, Math.max(0, state.worldWidth - canvas.width)),
          900 * dt
        );
      }

      function drawSky() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#182853');
        sky.addColorStop(0.58, '#152342');
        sky.addColorStop(1, '#091426');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const moonX = canvas.width * 0.77 - state.cameraX * 0.025;
        const moon = ctx.createRadialGradient(moonX, 80, 5, moonX, 80, 62);
        moon.addColorStop(0, 'rgba(221, 255, 249, .9)');
        moon.addColorStop(0.35, 'rgba(126, 241, 224, .25)');
        moon.addColorStop(1, 'rgba(126, 241, 224, 0)');
        ctx.fillStyle = moon;
        ctx.fillRect(moonX - 70, 10, 140, 140);

        ctx.fillStyle = 'rgba(117, 127, 199, 0.18)';
        ctx.beginPath();
        ctx.moveTo(0, 310);
        for (let x = 0; x <= canvas.width + 80; x += 80) {
          const worldX = x + state.cameraX * 0.08;
          ctx.lineTo(x, 238 + Math.sin(worldX * 0.008) * 34 + Math.sin(worldX * 0.019) * 13);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.fill();

        ctx.fillStyle = 'rgba(30, 54, 87, 0.72)';
        for (let x = -80 - (state.cameraX * 0.18) % 90; x < canvas.width + 100; x += 90) {
          const height = 65 + ((Math.abs(Math.floor(x / 90)) * 31) % 78);
          ctx.fillRect(x, canvas.height - height, 58, height);
          ctx.fillStyle = 'rgba(100, 238, 220, 0.12)';
          for (let y = canvas.height - height + 13; y < canvas.height - 8; y += 18) ctx.fillRect(x + 9, y, 5, 8);
          ctx.fillStyle = 'rgba(30, 54, 87, 0.72)';
        }
      }

      function drawPlatform(platform) {
        const isFinish = platform === state.finishPlatform;
        ctx.save();
        ctx.shadowBlur = isFinish ? 28 : 12;
        ctx.shadowColor = isFinish ? '#65f5dc' : 'rgba(49, 111, 169, 0.5)';
        const body = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
        body.addColorStop(0, isFinish ? '#68f2dc' : '#4c658b');
        body.addColorStop(0.18, isFinish ? '#1d9f95' : '#293d61');
        body.addColorStop(1, '#111c34');
        ctx.fillStyle = body;
        roundedRect(ctx, platform.x, platform.y, platform.w, platform.h, Math.min(7, platform.h / 2));
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = isFinish ? '#d8fff7' : '#86a9d7';
        ctx.fillRect(platform.x + 7, platform.y + 3, Math.max(0, platform.w - 14), 2);
        ctx.restore();

        if (isFinish) {
          const pulse = 0.65 + Math.sin(performance.now() * 0.005) * 0.18;
          ctx.strokeStyle = `rgba(101, 245, 220, ${pulse})`;
          ctx.lineWidth = 4;
          ctx.strokeRect(platform.x + platform.w - 56, platform.y - 72, 38, 70);
          ctx.fillStyle = '#d8fff7';
          ctx.fillRect(platform.x + platform.w - 49, platform.y - 61, 24, 3);
          ctx.fillRect(platform.x + platform.w - 49, platform.y - 48, 24, 3);
        }
      }

      function drawPlayer() {
        const blink = player.invulnerableLeft > 0 && Math.floor(player.invulnerableLeft * 18) % 2 === 0;
        if (blink) return;
        ctx.save();
        ctx.shadowColor = '#dffcff';
        ctx.shadowBlur = 20;
        const fill = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.h);
        fill.addColorStop(0, '#ffffff');
        fill.addColorStop(1, '#a9d7e8');
        ctx.fillStyle = fill;
        roundedRect(ctx, player.x, player.y, player.w, player.h, 7);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#182342';
        const eyeX = player.facing > 0 ? player.x + 18 : player.x + 6;
        ctx.fillRect(eyeX, player.y + 9, 4, 5);
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.save();
        ctx.shadowColor = '#ff365f';
        ctx.shadowBlur = 18;
        const gradient = ctx.createLinearGradient(enemy.x, enemy.y, enemy.x, enemy.y + enemy.h);
        gradient.addColorStop(0, '#ff6a82');
        gradient.addColorStop(1, '#a91549');
        ctx.fillStyle = gradient;
        roundedRect(ctx, enemy.x, enemy.y, enemy.w, enemy.h, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff0dc';
        ctx.fillRect(enemy.x + (enemy.dir > 0 ? 14 : 6), enemy.y + 7, 4, 4);
        ctx.restore();
      }

      function drawHud() {
        ctx.save();
        ctx.fillStyle = 'rgba(5, 11, 25, 0.68)';
        roundedRect(ctx, 14, 14, 182, 54, 13);
        ctx.fill();
        roundedRect(ctx, canvas.width - 154, 14, 140, 54, 13);
        ctx.fill();
        ctx.fillStyle = '#9db4d2';
        ctx.font = '700 11px system-ui';
        ctx.fillText('SECTOR', 29, 34);
        ctx.fillText('ENERGY CELLS', canvas.width - 139, 34);
        ctx.fillStyle = '#f2fbff';
        ctx.font = '800 18px system-ui';
        ctx.fillText(`${state.levelIndex + 1} / ${LEVELS.length}`, 29, 56);
        ctx.fillStyle = '#ffe487';
        ctx.fillText('◆'.repeat(state.ammoLeft) || 'EMPTY', canvas.width - 139, 56);
        ctx.restore();
      }

      function drawOverlay() {
        ctx.fillStyle = 'rgba(4, 8, 20, 0.76)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#65f5dc';
        ctx.font = '800 13px system-ui';
        ctx.fillText(state.gameComplete ? 'EXPEDITION COMPLETE' : 'SECTOR CLEARED', canvas.width / 2, 174);
        ctx.fillStyle = '#f5fbff';
        ctx.font = '900 46px system-ui';
        ctx.fillText(state.gameComplete ? 'The signal is restored' : 'Gateway reached', canvas.width / 2, 224);
        ctx.fillStyle = '#afc2da';
        ctx.font = '500 17px system-ui';
        ctx.fillText(state.gameComplete ? 'Press Space or tap to play again' : 'Press Space or tap for the next sector', canvas.width / 2, 260);
        ctx.textAlign = 'left';
      }

      function draw() {
        drawSky();
        const shakeX = state.shakeLeft > 0 ? (Math.random() - 0.5) * 8 : 0;
        const shakeY = state.shakeLeft > 0 ? (Math.random() - 0.5) * 5 : 0;

        ctx.save();
        ctx.translate(-state.cameraX + shakeX, shakeY);
        state.platforms.forEach(drawPlatform);

        for (const bullet of state.bullets) {
          ctx.save();
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ffe48a';
          ctx.fillStyle = '#fff1a8';
          roundedRect(ctx, bullet.x, bullet.y, bullet.w, bullet.h, 2);
          ctx.fill();
          ctx.restore();
        }

        state.enemies.forEach(drawEnemy);
        drawPlayer();

        for (const particle of state.particles) {
          ctx.globalAlpha = Math.min(1, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        ctx.globalAlpha = 1;
        ctx.restore();

        drawHud();
        if (state.flashLeft > 0) {
          ctx.fillStyle = `rgba(255, 75, 111, ${state.flashLeft * 1.5})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        if (state.levelComplete) drawOverlay();
      }

      function setKeyState(key, isDown) {
        const normalized = key.toLowerCase();
        if (key === 'ArrowLeft' || normalized === 'a') input.left = isDown;
        if (key === 'ArrowRight' || normalized === 'd') input.right = isDown;
        if (key === ' ') setJumpDown(isDown);
      }

      window.addEventListener('keydown', (event) => {
        const normalized = event.key.toLowerCase();
        if (['arrowleft', 'arrowright', ' ', 'control', 'a', 'd'].includes(normalized)) event.preventDefault();
        if (event.key === ' ' && !event.repeat && state.levelComplete) {
          advanceLevel();
          return;
        }
        if (normalized === 'control' && !event.repeat) tryShoot();
        setKeyState(event.key, true);
      });
      window.addEventListener('keyup', (event) => setKeyState(event.key, false));
      window.addEventListener('blur', () => {
        input.left = false;
        input.right = false;
        setJumpDown(false);
      });

      function bindHoldButton(button, onPress, onRelease) {
        const release = () => {
          button.classList.remove('is-active');
          onRelease();
        };
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          button.classList.add('is-active');
          onPress();
        }, { passive: false });
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      }
      bindHoldButton(jumpBtn, () => setJumpDown(true), () => setJumpDown(false));
      bindHoldButton(shootBtn, tryShoot, () => {});

      canvas.addEventListener('pointerdown', (event) => {
        if (!state.levelComplete) return;
        event.preventDefault();
        advanceLevel();
      }, { passive: false });
      window.addEventListener('contextmenu', (event) => event.preventDefault());

      function onDeviceOrientation(event) {
        if (typeof event.gamma !== 'number' || typeof event.beta !== 'number') return;
        const angle = screen.orientation?.angle ?? window.orientation ?? 0;
        const landscape = Math.abs(angle) === 90;
        const rawTilt = landscape ? event.beta * (angle === 90 ? -1 : 1) : event.gamma;
        state.tilt = clamp(rawTilt, -TUNING.maxTilt, TUNING.maxTilt);
        motionStatusEl.textContent = `Tilt: active (${state.tilt.toFixed(1)}°)`;
      }

      async function enableMotion() {
        if (typeof DeviceOrientationEvent === 'undefined') {
          motionStatusEl.textContent = 'Tilt: not supported on this device';
          return;
        }
        try {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
              motionStatusEl.textContent = 'Tilt: permission denied';
              return;
            }
          }
          window.addEventListener('deviceorientation', onDeviceOrientation, { passive: true });
          motionBtn.hidden = true;
          motionStatusEl.textContent = 'Tilt: enabled';
        } catch {
          motionStatusEl.textContent = 'Tilt: could not start';
        }
      }
      motionBtn.addEventListener('click', enableMotion);

      let previousTime = performance.now();
      function gameLoop(time) {
        // Для программиста: ограничение dt не даёт объектам пролететь сквозь платформы после смены вкладки.
        const dt = Math.min((time - previousTime) / 1000, 1 / 30);
        previousTime = time;
        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
      }

      loadLevel(0);
      requestAnimationFrame(gameLoop);
    </script>
    <script src="/game-audio.js"></script>
</body>
</html>
