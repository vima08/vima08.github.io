<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ночная стража Шира</title>
  <link rel="icon" href="/favicons/goblins-2.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --moon: #ffe5a0; --moss: #a8cb68; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #fff2cf; font-family: Georgia, Cambria, serif;
      background:
        radial-gradient(circle at 50% 8%, #263e4b 0, transparent 38%),
        linear-gradient(145deg, #091218, #050809 72%);
    }
    main { width: min(1100px, 100%); padding: clamp(12px, 2.5vw, 28px); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -.035em; }
    h1 span { color: var(--moon); text-shadow: 0 0 24px #ffe5a055; }
    .subtitle { color: #99a9a3; font: 700 12px Inter, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    .frame { padding: 1px; border-radius: 23px; background: linear-gradient(135deg, #d9bc6e99, #ffffff10 50%, #668c7799); box-shadow: 0 32px 90px #000d, 0 0 45px #a4d7c112; }
    canvas { display: block; width: 100%; height: auto; border-radius: 22px; cursor: crosshair; touch-action: none; }
    .hint { display: flex; justify-content: space-between; gap: 16px; margin: 12px 3px 0; color: #99aaa4; font: 13px Inter, system-ui, sans-serif; }
    kbd { padding: 2px 7px; border: 1px solid #52625c; border-bottom-width: 2px; border-radius: 6px; color: #ffe39a; background: #14201d; }
    @media (max-width: 620px) { header, .hint { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>НОЧНАЯ <span>СТРАЖА</span></h1>
      <div class="subtitle">Шир должен продержаться до рассвета</div>
    </header>
    <div class="frame">
      <canvas id="game" width="960" height="540" aria-label="Хоббит защищает Шир от гоблинов"></canvas>
    </div>
    <div class="hint">
      <span>Кликните или коснитесь поля, чтобы бросить камень</span>
      <span><kbd>R</kbd> начать заново · три прорыва означают поражение</span>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const GROUND_Y = 445;
    const GOAL = 15;
    const GRAVITY = 440;
    const THROW_DURATION = .65;
    const RELEASE_AT = .43;

    const state = { goblins: [], stones: [], particles: [], score: 0, lives: 3, ended: false, won: false, spawnTimer: .7 };
    const hobbit = { x: 118, y: GROUND_Y - 2, cooldown: 0, throw: null };
    const pointer = { x: 680, y: 230, visible: false };
    const stars = Array.from({ length: 65 }, (_, index) => ({ x: (index * 137.3) % W, y: 24 + (index * 53.7) % 260, size: index % 9 === 0 ? 2 : 1 }));
    let shake = 0;
    let lastTime = performance.now();

    const random = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function reset() {
      Object.assign(state, { goblins: [], stones: [], particles: [], score: 0, lives: 3, ended: false, won: false, spawnTimer: .7 });
      hobbit.cooldown = 0;
      hobbit.throw = null;
      shake = 0;
    }

    function spawnGoblin() {
      state.goblins.push({
        x: W + 48,
        y: GROUND_Y,
        speed: random(39, 57) + state.score * 1.65,
        phase: random(0, Math.PI * 2),
        scale: random(.84, 1.1)
      });
    }

    function beginThrow(targetX, targetY) {
      if (state.ended) { reset(); return; }
      if (hobbit.cooldown > 0 || hobbit.throw) return;
      const startX = hobbit.x + 35;
      hobbit.throw = {
        elapsed: 0,
        released: false,
        // Для программиста: цель за спиной ограничена — отрицательное время полёта больше не создаёт «сломанный» бросок.
        targetX: clamp(targetX, startX + 45, W - 12),
        targetY: clamp(targetY, 62, GROUND_Y - 6)
      };
      hobbit.cooldown = THROW_DURATION;
    }

    function releaseStone(action) {
      const startX = hobbit.x + 35;
      const startY = hobbit.y - 83;
      const dx = action.targetX - startX;
      const dy = action.targetY - startY;
      const flightTime = clamp(dx / 430, .55, 1.42);
      state.stones.push({
        x: startX, y: startY, previousX: startX, previousY: startY,
        vx: dx / flightTime,
        vy: (dy - GRAVITY * flightTime * flightTime / 2) / flightTime,
        spin: 0
      });
    }

    function segmentDistanceSquared(x1, y1, x2, y2, px, py) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared ? clamp(((px - x1) * dx + (py - y1) * dy) / lengthSquared, 0, 1) : 0;
      const nearX = x1 + dx * t;
      const nearY = y1 + dy * t;
      return (px - nearX) ** 2 + (py - nearY) ** 2;
    }

    function stoneHitsGoblin(stone, goblin) {
      const centerX = goblin.x;
      const centerY = goblin.y - 55 * goblin.scale;
      const radius = 32 * goblin.scale + 7;
      return segmentDistanceSquared(stone.previousX, stone.previousY, stone.x, stone.y, centerX, centerY) <= radius * radius;
    }

    function burst(x, y, palette, amount = 18) {
      for (let i = 0; i < amount; i += 1) {
        const angle = random(0, Math.PI * 2);
        const speed = random(30, 190);
        state.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 35, life: random(.3, .85), size: random(2, 6), color: palette[i % palette.length], glow: i % 4 === 0 });
      }
    }

    function updateGame(dt) {
      hobbit.cooldown = Math.max(0, hobbit.cooldown - dt);
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnGoblin();
        state.spawnTimer = Math.max(.58, 1.42 - state.score * .045) + random(-.1, .15);
      }

      if (hobbit.throw) {
        hobbit.throw.elapsed += dt;
        const progress = hobbit.throw.elapsed / THROW_DURATION;
        if (!hobbit.throw.released && progress >= RELEASE_AT) {
          releaseStone(hobbit.throw);
          hobbit.throw.released = true;
        }
        if (progress >= 1) hobbit.throw = null;
      }

      for (const stone of state.stones) {
        stone.previousX = stone.x;
        stone.previousY = stone.y;
        stone.vy += GRAVITY * dt;
        stone.x += stone.vx * dt;
        stone.y += stone.vy * dt;
        stone.spin += dt * 12;
      }
      for (const goblin of state.goblins) goblin.x -= goblin.speed * dt;

      for (let goblinIndex = state.goblins.length - 1; goblinIndex >= 0; goblinIndex -= 1) {
        const goblin = state.goblins[goblinIndex];
        if (goblin.x < 165) {
          state.goblins.splice(goblinIndex, 1);
          // Для программиста: жизни зажаты в диапазоне 0..3; отрицательное значение больше не ломает String.repeat в HUD.
          state.lives = Math.max(0, state.lives - 1);
          shake = 9;
          burst(161, GROUND_Y - 32, ['#e27660', '#f0b068', '#594035'], 20);
          if (state.lives === 0) {
            state.ended = true;
            break;
          }
          continue;
        }

        for (let stoneIndex = state.stones.length - 1; stoneIndex >= 0; stoneIndex -= 1) {
          const stone = state.stones[stoneIndex];
          if (!stoneHitsGoblin(stone, goblin)) continue;
          state.goblins.splice(goblinIndex, 1);
          state.stones.splice(stoneIndex, 1);
          state.score = Math.min(GOAL, state.score + 1);
          shake = 5;
          burst(stone.x, stone.y, ['#b7d967', '#718c3d', '#e6cf83', '#49372c'], 23);
          if (state.score >= GOAL) {
            state.won = true;
            state.ended = true;
          }
          break;
        }
        if (state.ended) break;
      }

      // Снаряды чистятся по всем границам, включая верхнюю и левую.
      state.stones = state.stones.filter((stone) => stone.x > -50 && stone.x < W + 60 && stone.y > -180 && stone.y < H + 55);
    }

    function updateParticles(dt) {
      for (const particle of state.particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vy += 210 * dt;
        particle.life -= dt;
      }
      state.particles = state.particles.filter((particle) => particle.life > 0);
      shake = Math.max(0, shake - 28 * dt);
    }

    function update(dt) {
      if (!state.ended) updateGame(dt);
      updateParticles(dt);
    }

    function drawBackground(time) {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#061321'); sky.addColorStop(.55, '#253e4a'); sky.addColorStop(1, '#b57655');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

      for (const star of stars) {
        ctx.globalAlpha = .35 + Math.sin(time * .003 + star.x) * .18;
        ctx.fillStyle = '#edf6df'; ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;
      const moon = ctx.createRadialGradient(746, 101, 3, 746, 101, 86);
      moon.addColorStop(0, '#fffde7'); moon.addColorStop(.25, '#e8e2bd'); moon.addColorStop(1, '#d9e5c000');
      ctx.fillStyle = moon; ctx.beginPath(); ctx.arc(746, 101, 86, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e9e4c8'; ctx.beginPath(); ctx.arc(746, 101, 35, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9c5aa55'; ctx.beginPath(); ctx.arc(734, 92, 7, 0, Math.PI * 2); ctx.arc(757, 111, 5, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = .2;
      for (let i = 0; i < 5; i += 1) {
        const x = ((i * 247 + time * .004) % (W + 220)) - 110;
        ctx.fillStyle = '#dce5dc'; ctx.beginPath(); ctx.ellipse(x, 132 + i % 2 * 72, 85, 12, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#142630'; ctx.beginPath(); ctx.moveTo(0, 325);
      for (let x = 0; x <= W; x += 78) ctx.lineTo(x, 212 + Math.sin(x * .017) * 55);
      ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.fill();
      ctx.fillStyle = '#233a36'; ctx.beginPath(); ctx.moveTo(0, 382);
      for (let x = 0; x <= W; x += 46) ctx.lineTo(x, 307 + Math.sin(x * .027 + 1) * 37);
      ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.fill();

      // Дальние деревья дают глубину, оставаясь чистыми векторными силуэтами.
      ctx.fillStyle = '#172c27';
      for (let x = 205; x < W; x += 82) {
        const height = 68 + (x * 13 % 38);
        ctx.fillRect(x - 4, GROUND_Y - height, 8, height);
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y - height - 34); ctx.lineTo(x - 28, GROUND_Y - height + 20); ctx.lineTo(x + 28, GROUND_Y - height + 20); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y - height - 8); ctx.lineTo(x - 34, GROUND_Y - height + 48); ctx.lineTo(x + 34, GROUND_Y - height + 48); ctx.fill();
      }

      ctx.fillStyle = '#355a38'; ctx.beginPath(); ctx.ellipse(82, 421, 194, 108, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#223522'; ctx.fillRect(0, 399, 181, 70);
      ctx.fillStyle = '#69452c'; ctx.beginPath(); ctx.arc(70, 416, 49, Math.PI, 0); ctx.fillRect(21, 415, 98, 57); ctx.fill();
      ctx.strokeStyle = '#aa7b47'; ctx.lineWidth = 6; ctx.stroke();
      const windowGlow = ctx.createRadialGradient(70, 425, 3, 70, 425, 43);
      windowGlow.addColorStop(0, '#fff4a4'); windowGlow.addColorStop(.42, '#f4bd4e'); windowGlow.addColorStop(1, '#f4bd4e00');
      ctx.fillStyle = windowGlow; ctx.beginPath(); ctx.arc(70, 425, 43, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f8c85d'; ctx.beginPath(); ctx.arc(70, 425, 25, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5b3d25'; ctx.lineWidth = 4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(45, 425); ctx.lineTo(95, 425); ctx.moveTo(70, 400); ctx.lineTo(70, 450); ctx.stroke();

      const ground = ctx.createLinearGradient(0, GROUND_Y, 0, H);
      ground.addColorStop(0, '#213a2a'); ground.addColorStop(1, '#0c1711');
      ctx.fillStyle = ground; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      for (let x = 0; x < W; x += 17) {
        ctx.strokeStyle = `rgba(102, 143, 68, ${.22 + .13 * Math.sin(x)})`;
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 18); ctx.lineTo(x + Math.sin(time * .002 + x) * 5, GROUND_Y - 2 - (x * 17 % 11)); ctx.stroke();
      }

      // Светлячки — дешёвый по вычислениям слой движения, оживляющий спокойные зоны кадра.
      for (let i = 0; i < 14; i += 1) {
        const x = 185 + (i * 59) % 720 + Math.sin(time * .001 + i) * 16;
        const y = 290 + (i * 31) % 130 + Math.cos(time * .0014 + i) * 10;
        ctx.globalAlpha = .25 + .35 * (Math.sin(time * .004 + i) + 1) / 2;
        ctx.fillStyle = '#dfff75'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      const fog = ctx.createLinearGradient(0, 330, 0, 455);
      fog.addColorStop(0, '#c8d8cc00'); fog.addColorStop(.55, '#c8d8cc13'); fog.addColorStop(1, '#c8d8cc00');
      ctx.fillStyle = fog; ctx.fillRect(0, 330, W, 125);
    }

    function limb(x, y, length, angle, width, color) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(angle) * length, y + Math.cos(angle) * length); ctx.stroke();
    }

    function drawGoblin(goblin, time) {
      const walk = Math.sin(time * .009 * goblin.speed / 40 + goblin.phase);
      ctx.save(); ctx.translate(goblin.x, goblin.y); ctx.scale(goblin.scale, goblin.scale);
      ctx.fillStyle = '#0007'; ctx.beginPath(); ctx.ellipse(0, 4, 30, 8, 0, 0, Math.PI * 2); ctx.fill();
      limb(-12, -38, 38, walk * .65, 10, '#4d612c'); limb(12, -38, 38, -walk * .65, 10, '#4d612c');
      limb(-18, -63, 32, -walk * .75, 9, '#657d37'); limb(18, -63, 32, walk * .75, 9, '#657d37');
      ctx.fillStyle = '#4c392d'; ctx.beginPath(); ctx.roundRect(-24, -76, 48, 45, 12); ctx.fill();
      ctx.fillStyle = '#273018'; ctx.fillRect(-25, -44, 50, 8);
      ctx.fillStyle = '#718b3e'; ctx.beginPath(); ctx.ellipse(0, -88, 25, 27, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, -94); ctx.lineTo(-42, -105); ctx.lineTo(-22, -81); ctx.moveTo(18, -94); ctx.lineTo(42, -105); ctx.lineTo(22, -81); ctx.fill();
      ctx.shadowColor = '#ffd65b'; ctx.shadowBlur = 7; ctx.fillStyle = '#ffcf54';
      ctx.beginPath(); ctx.ellipse(-9, -91, 4, 3, 0, 0, Math.PI * 2); ctx.ellipse(9, -91, 4, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = '#31231c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -80, 11, .2, Math.PI - .2); ctx.stroke();
      ctx.strokeStyle = '#9d7c4d'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(25, -69); ctx.lineTo(39, -20); ctx.stroke();
      ctx.restore();
    }

    function drawHobbit() {
      const progress = hobbit.throw ? clamp(hobbit.throw.elapsed / THROW_DURATION, 0, 1) : 1;
      const active = Boolean(hobbit.throw);
      const wind = active ? (progress < RELEASE_AT ? progress / RELEASE_AT : Math.max(0, 1 - (progress - RELEASE_AT) / (1 - RELEASE_AT))) : 0;
      ctx.save(); ctx.translate(hobbit.x, hobbit.y);
      ctx.fillStyle = '#0007'; ctx.beginPath(); ctx.ellipse(0, 4, 36, 9, 0, 0, Math.PI * 2); ctx.fill();
      limb(-11, -39, 38, -.12, 12, '#7f5a36'); limb(11, -39, 38, .12, 12, '#7f5a36');
      ctx.fillStyle = '#4f6d37'; ctx.beginPath(); ctx.roundRect(-28, -88, 56, 53, 15); ctx.fill();
      ctx.fillStyle = '#8a6439'; ctx.fillRect(-29, -48, 58, 8);
      limb(-20, -75, 34, -.8 + wind * 1.15, 11, '#d8a66c');
      const armAngle = .7 - wind * 2.2; limb(20, -76, 39, armAngle, 11, '#d8a66c');
      ctx.fillStyle = '#d9aa72'; ctx.beginPath(); ctx.arc(0, -106, 24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a321e'; ctx.beginPath(); ctx.arc(0, -112, 26, Math.PI, Math.PI * 2); ctx.arc(-18, -108, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#27331c'; ctx.beginPath(); ctx.moveTo(-29, -91); ctx.quadraticCurveTo(0, -126, 31, -91); ctx.lineTo(23, -84); ctx.quadraticCurveTo(0, -103, -24, -83); ctx.fill();
      ctx.fillStyle = '#2b211b'; ctx.beginPath(); ctx.arc(-8, -106, 2.5, 0, Math.PI * 2); ctx.arc(8, -106, 2.5, 0, Math.PI * 2); ctx.fill();
      if (active && !hobbit.throw.released) {
        const handX = 20 + Math.sin(armAngle) * 39;
        const handY = -76 + Math.cos(armAngle) * 39;
        ctx.fillStyle = '#858279'; ctx.beginPath(); ctx.arc(handX, handY, 7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawStone(stone) {
      ctx.save(); ctx.translate(stone.x, stone.y); ctx.rotate(stone.spin);
      ctx.shadowColor = '#e7e0b8'; ctx.shadowBlur = 7;
      const gradient = ctx.createLinearGradient(-8, -6, 8, 6); gradient.addColorStop(0, '#aaa89d'); gradient.addColorStop(1, '#4e504b');
      ctx.fillStyle = gradient; ctx.beginPath(); ctx.ellipse(0, 0, 8, 6, .3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    function drawAimGuide() {
      if (!pointer.visible || state.ended || hobbit.cooldown > 0) return;
      const startX = hobbit.x + 35;
      const startY = hobbit.y - 83;
      const targetX = clamp(pointer.x, startX + 45, W - 12);
      const targetY = clamp(pointer.y, 62, GROUND_Y - 6);
      const flightTime = clamp((targetX - startX) / 430, .55, 1.42);
      const vx = (targetX - startX) / flightTime;
      const vy = (targetY - startY - GRAVITY * flightTime * flightTime / 2) / flightTime;
      ctx.fillStyle = '#f7e8a955';
      // Для геймдизайнера: лишь начало дуги показано игроку — подсказка обучает, не превращая бросок в автоприцел.
      for (let t = .12; t <= Math.min(.58, flightTime); t += .1) {
        ctx.beginPath(); ctx.arc(startX + vx * t, startY + vy * t + GRAVITY * t * t / 2, 2.3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = '#fff0ad99'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(targetX, targetY, 11, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(targetX - 17, targetY); ctx.lineTo(targetX + 17, targetY); ctx.moveTo(targetX, targetY - 17); ctx.lineTo(targetX, targetY + 17); ctx.stroke();
    }

    function drawHud() {
      ctx.fillStyle = '#08110fc7'; ctx.beginPath(); ctx.roundRect(20, 18, 274, 48, 13); ctx.fill();
      ctx.font = '700 12px Inter, system-ui'; ctx.fillStyle = '#a8b8a5'; ctx.fillText('ГОБЛИНЫ ОСТАНОВЛЕНЫ', 39, 37);
      ctx.font = '900 20px Inter, system-ui'; ctx.fillStyle = '#f8dda0'; ctx.fillText(`${state.score} / ${GOAL}`, 39, 59);

      ctx.fillStyle = '#08110fc7'; ctx.beginPath(); ctx.roundRect(W - 190, 18, 170, 48, 13); ctx.fill();
      ctx.font = '700 12px Inter, system-ui'; ctx.fillStyle = '#a8b8a5'; ctx.fillText('ЗАЩИТА ШИРА', W - 171, 37);
      ctx.font = '900 20px Inter, system-ui'; ctx.fillStyle = '#e9665c'; ctx.fillText(state.lives > 0 ? '♥ '.repeat(state.lives).trim() : '—', W - 171, 59);

      if (state.ended) {
        ctx.fillStyle = '#06100ddd'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.font = '900 56px Georgia, serif';
        ctx.fillStyle = state.won ? '#f8dc82' : '#e57b67';
        ctx.fillText(state.won ? 'ШИР СПАСЁН!' : 'ГОБЛИНЫ ПРОРВАЛИСЬ', W / 2, H / 2 - 22);
        ctx.font = '500 19px Inter, system-ui'; ctx.fillStyle = '#eee4cb';
        ctx.fillText('Кликните или нажмите R, чтобы сыграть ещё раз', W / 2, H / 2 + 29);
        ctx.textAlign = 'left';
      }
    }

    function draw(now) {
      ctx.save();
      if (shake > 0) ctx.translate(random(-shake, shake), random(-shake, shake));
      drawBackground(now);
      state.goblins.forEach((goblin) => drawGoblin(goblin, now));
      drawHobbit();
      state.stones.forEach(drawStone);
      for (const particle of state.particles) {
        ctx.globalAlpha = clamp(particle.life * 1.8, 0, 1);
        if (particle.glow) { ctx.shadowColor = particle.color; ctx.shadowBlur = 9; }
        ctx.fillStyle = particle.color; ctx.fillRect(particle.x, particle.y, particle.size, particle.size); ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
      drawAimGuide();
      drawHud();
      ctx.restore();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height };
    }
    canvas.addEventListener('pointermove', (event) => Object.assign(pointer, canvasPoint(event), { visible: true }));
    canvas.addEventListener('pointerleave', () => { pointer.visible = false; });
    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const point = canvasPoint(event);
      Object.assign(pointer, point, { visible: true });
      beginThrow(point.x, point.y);
    });
    addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'r' && !event.repeat) reset();
    });

    function frame(now) {
      const dt = Math.min((now - lastTime) / 1000, .033);
      lastTime = now;
      update(dt);
      draw(now);
      requestAnimationFrame(frame);
    }

    reset();
    requestAnimationFrame(frame);
  </script>
  <script src="/game-audio.js"></script>
  <script src="/gamepad-controls.js"></script>
</body>
</html>
