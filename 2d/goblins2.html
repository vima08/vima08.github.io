<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Хоббит против гоблинов</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; font-family: Georgia, "Times New Roman", serif;
      color: #fff4ce; background: radial-gradient(circle at 50% 15%, #293b3d, #080d12 70%);
    }
    .game-shell { position: relative; width: min(100vw, 1100px); padding: 18px; }
    canvas {
      display: block; width: 100%; height: auto; aspect-ratio: 16/9;
      border: 2px solid #9e7b3f; border-radius: 20px; cursor: crosshair;
      box-shadow: 0 24px 70px #000c, inset 0 0 40px #0008; touch-action: none;
    }
    .hint { margin: 10px 0 0; text-align: center; color: #b8b09b; font: 14px system-ui, sans-serif; }
    kbd { padding: 2px 7px; border: 1px solid #71654f; border-radius: 5px; background: #171b1c; color: #f5d894; }
  </style>
</head>
<body>
  <main class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Игра: хоббит защищает Шир от гоблинов"></canvas>
    <p class="hint">Кликните по полю, чтобы бросить камень · <kbd>R</kbd> — начать заново</p>
  </main>
<script>
const canvas = document.querySelector('#game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, ground = 445;
const state = { goblins: [], stones: [], sparks: [], score: 0, lives: 3, ended: false, won: false, lastSpawn: 0, start: performance.now() };
const hobbit = { x: 118, y: ground - 2, throwStart: -9999, target: null, released: true };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function reset() {
  Object.assign(state, { goblins: [], stones: [], sparks: [], score: 0, lives: 3, ended: false, won: false, lastSpawn: performance.now(), start: performance.now() });
  hobbit.throwStart = -9999; hobbit.released = true;
}

function spawn(now) {
  state.goblins.push({ x: W + 45, y: ground, speed: rand(25, 40) + state.score * 1.2, phase: rand(0, Math.PI * 2), scale: rand(.84, 1.08), hp: 1 });
  state.lastSpawn = now;
}

function throwStone(x, y, now) {
  if (state.ended) { reset(); return; }
  if (now - hobbit.throwStart < 650) return;
  hobbit.throwStart = now; hobbit.target = { x, y }; hobbit.released = false;
}

canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  throwStone((e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height, performance.now());
});
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r') reset(); });

function update(now, dt) {
  if (state.ended) return;
  if (now - state.lastSpawn > Math.max(620, 1450 - state.score * 45)) spawn(now);
  const tp = (now - hobbit.throwStart) / 650;
  if (!hobbit.released && tp >= .43) {
    const sx = hobbit.x + 35, sy = hobbit.y - 83;
    const dx = hobbit.target.x - sx, dy = hobbit.target.y - sy;
    const flight = clamp(dx / 430, .55, 1.35);
    state.stones.push({ x:sx, y:sy, vx:dx/flight, vy:(dy - 220*flight*flight)/flight, spin:0 });
    hobbit.released = true;
  }
  state.stones.forEach(s => { s.vy += 440*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.spin += dt*12; });
  state.stones = state.stones.filter(s => s.x < W+30 && s.y < H+30);
  for (const g of state.goblins) g.x -= g.speed * dt;
  for (let i=state.goblins.length-1; i>=0; i--) {
    const g=state.goblins[i];
    if (g.x < 165) { state.goblins.splice(i,1); state.lives--; if (!state.lives) state.ended=true; continue; }
    for (let j=state.stones.length-1; j>=0; j--) {
      const s=state.stones[j];
      if (Math.hypot(s.x-g.x, s.y-(g.y-54*g.scale)) < 35*g.scale) {
        state.goblins.splice(i,1); state.stones.splice(j,1); state.score++;
        for(let k=0;k<14;k++) state.sparks.push({x:s.x,y:s.y,vx:rand(-90,90),vy:rand(-120,20),life:rand(.3,.7)});
        if(state.score>=15){state.won=true;state.ended=true;} break;
      }
    }
  }
  state.sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt;});
  state.sparks=state.sparks.filter(p=>p.life>0);
}

function background(t) {
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#071522');sky.addColorStop(.55,'#324854');sky.addColorStop(1,'#d49761');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const moon=ctx.createRadialGradient(745,100,5,745,100,80);moon.addColorStop(0,'#fffbd8');moon.addColorStop(.25,'#e8e5c3');moon.addColorStop(1,'#d7dfc000');ctx.fillStyle=moon;ctx.beginPath();ctx.arc(745,100,80,0,7);ctx.fill();
  ctx.fillStyle='#182833'; ctx.beginPath();ctx.moveTo(0,320); for(let x=0;x<=W;x+=80)ctx.lineTo(x,210+Math.sin(x*.017)*55);ctx.lineTo(W,450);ctx.lineTo(0,450);ctx.fill();
  ctx.fillStyle='#273a35';ctx.beginPath();ctx.moveTo(0,370);for(let x=0;x<=W;x+=45)ctx.lineTo(x,305+Math.sin(x*.026+1)*38);ctx.lineTo(W,460);ctx.lineTo(0,460);ctx.fill();
  // Hobbit hill and warm windows
  ctx.fillStyle='#355a35';ctx.beginPath();ctx.ellipse(80,420,190,105,0,0,7);ctx.fill();ctx.fillStyle='#253622';ctx.fillRect(0,398,180,65);
  ctx.fillStyle='#6b4529';ctx.beginPath();ctx.arc(70,414,48,Math.PI,0);ctx.fillRect(22,414,96,48);ctx.fill();ctx.strokeStyle='#a77a47';ctx.lineWidth=6;ctx.stroke();
  ctx.fillStyle='#f8c85d';ctx.beginPath();ctx.arc(70,422,25,0,7);ctx.fill();ctx.strokeStyle='#5b3d25';ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.moveTo(45,422);ctx.lineTo(95,422);ctx.moveTo(70,397);ctx.lineTo(70,447);ctx.stroke();
  ctx.fillStyle='#18261d';ctx.fillRect(0,ground,W,H-ground);
  for(let x=0;x<W;x+=18){ctx.strokeStyle=`rgba(93,130,62,${.25+.15*Math.sin(x)})`;ctx.beginPath();ctx.moveTo(x,ground+18);ctx.lineTo(x+Math.sin(t*.002+x)*5,ground-2-(x*17%11));ctx.stroke();}
  ctx.fillStyle='#0005';ctx.fillRect(0,0,W,70);
}

function limb(x,y,len,angle,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(angle)*len,y+Math.cos(angle)*len);ctx.stroke();}

function drawGoblin(g,t) {
  const walk=Math.sin(t*.009*g.speed/30+g.phase), s=g.scale;
  ctx.save();ctx.translate(g.x,g.y);ctx.scale(s,s);
  ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,3,29,8,0,0,7);ctx.fill();
  limb(-12,-38,38,walk*.65,10,'#52672d');limb(12,-38,38,-walk*.65,10,'#52672d');
  limb(-18,-63,32,-walk*.75,9,'#657b35');limb(18,-63,32,walk*.75,9,'#657b35');
  ctx.fillStyle='#503b2d';ctx.beginPath();ctx.roundRect(-24,-76,48,45,12);ctx.fill();ctx.fillStyle='#283019';ctx.fillRect(-25,-44,50,8);
  ctx.fillStyle='#718b3e';ctx.beginPath();ctx.ellipse(0,-88,25,27,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-18,-94);ctx.lineTo(-42,-105);ctx.lineTo(-22,-81);ctx.moveTo(18,-94);ctx.lineTo(42,-105);ctx.lineTo(22,-81);ctx.fill();
  ctx.fillStyle='#ffcf54';ctx.beginPath();ctx.ellipse(-9,-91,4,3,0,0,7);ctx.ellipse(9,-91,4,3,0,0,7);ctx.fill();
  ctx.strokeStyle='#31231c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-80,11,.2,Math.PI-.2);ctx.stroke();
  ctx.strokeStyle='#9d7c4d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(25,-69);ctx.lineTo(39,-20);ctx.stroke();
  ctx.restore();
}

function drawHobbit(now) {
  const p=clamp((now-hobbit.throwStart)/650,0,1), active=p<1;
  const wind=active ? (p<.43?p/.43:1-(p-.43)/.57) : 0;
  ctx.save();ctx.translate(hobbit.x,hobbit.y);
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,4,36,9,0,0,7);ctx.fill();
  limb(-11,-39,38,-.12,12,'#7f5a36');limb(11,-39,38,.12,12,'#7f5a36');
  ctx.fillStyle='#4f6d37';ctx.beginPath();ctx.roundRect(-28,-88,56,53,15);ctx.fill();ctx.fillStyle='#8a6439';ctx.fillRect(-29,-48,58,8);
  limb(-20,-75,34,-.8+wind*1.15,11,'#d8a66c');
  const armAngle=.7-wind*2.2;limb(20,-76,39,armAngle,11,'#d8a66c');
  ctx.fillStyle='#d9aa72';ctx.beginPath();ctx.arc(0,-106,24,0,7);ctx.fill();
  ctx.fillStyle='#5a321e';ctx.beginPath();ctx.arc(0,-112,26,Math.PI,Math.PI*2);ctx.arc(-18,-108,10,0,7);ctx.fill();
  ctx.fillStyle='#27331c';ctx.beginPath();ctx.moveTo(-29,-91);ctx.quadraticCurveTo(0,-126,31,-91);ctx.lineTo(23,-84);ctx.quadraticCurveTo(0,-103,-24,-83);ctx.fill();
  ctx.fillStyle='#2b211b';ctx.beginPath();ctx.arc(-8,-106,2.5,0,7);ctx.arc(8,-106,2.5,0,7);ctx.fill();
  if(active&&!hobbit.released){const hx=20+Math.sin(armAngle)*39,hy=-76+Math.cos(armAngle)*39;ctx.fillStyle='#77746c';ctx.beginPath();ctx.arc(hx,hy,7,0,7);ctx.fill();}
  ctx.restore();
}

function hud() {
  ctx.fillStyle='#0b1016bb';ctx.beginPath();ctx.roundRect(22,18,300,42,12);ctx.fill();ctx.font='bold 20px Georgia';ctx.fillStyle='#f8dda0';ctx.fillText(`ПОБЕЖДЕНО: ${state.score} / 15`,40,46);
  ctx.fillStyle='#0b1016bb';ctx.beginPath();ctx.roundRect(W-175,18,153,42,12);ctx.fill();ctx.fillStyle='#e8584d';ctx.fillText('♥ '.repeat(state.lives),W-153,46);
  if(state.ended){ctx.fillStyle='#071015d9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=state.won?'#f8dc82':'#e57b67';ctx.font='bold 58px Georgia';ctx.fillText(state.won?'ШИР СПАСЁН!':'ГОБЛИНЫ ПРОРВАЛИСЬ',W/2,H/2-20);ctx.font='22px system-ui';ctx.fillStyle='#eee4cb';ctx.fillText('Кликните или нажмите R, чтобы сыграть ещё раз',W/2,H/2+30);ctx.textAlign='left';}
}

let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,.034);last=now;update(now,dt);background(now);state.goblins.forEach(g=>drawGoblin(g,now));drawHobbit(now);state.stones.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.spin);ctx.fillStyle='#77746c';ctx.beginPath();ctx.ellipse(0,0,8,6,.3,0,7);ctx.fill();ctx.restore();});state.sparks.forEach(p=>{ctx.globalAlpha=p.life*1.8;ctx.fillStyle='#b5d25a';ctx.fillRect(p.x,p.y,4,4);});ctx.globalAlpha=1;hud();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
</body>
</html>
