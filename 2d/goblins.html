<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оборона холма — Hobbit Sling</title>
  <link rel="icon" href="/favicons/goblins.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --gold: #f7d678; --green: #91c96b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #fff3cf; font-family: Georgia, Cambria, serif;
      background:
        radial-gradient(circle at 50% 10%, #40564f, transparent 40%),
        linear-gradient(150deg, #101b18, #080c0d 70%);
    }
    main { width: min(1080px, 100%); padding: clamp(12px, 2.6vw, 28px); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -.035em; }
    h1 span { color: var(--gold); text-shadow: 0 0 22px #f7d67855; }
    .mission { color: #acb9a5; font: 700 12px Inter, system-ui, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .frame { padding: 1px; border-radius: 22px; background: linear-gradient(135deg, #e5c36f99, #ffffff12 52%, #709b6799); box-shadow: 0 30px 85px #000c; }
    canvas { display: block; width: 100%; height: auto; border-radius: 21px; cursor: crosshair; touch-action: none; }
    .help { display: flex; justify-content: space-between; gap: 16px; margin: 12px 3px 0; color: #a6afa0; font: 13px Inter, system-ui, sans-serif; }
    kbd { padding: 2px 7px; border: 1px solid #526052; border-bottom-width: 2px; border-radius: 6px; color: #ffe59d; background: #172019; }
    @media (max-width: 620px) { header, .help { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ОБОРОНА <span>ХОЛМА</span></h1>
      <div class="mission">Остановите 10 гоблинов</div>
    </header>
    <div class="frame">
      <canvas id="game" width="960" height="540" aria-label="Хоббит защищает холм от гоблинов"></canvas>
    </div>
    <div class="help">
      <span>Укажите цель кликом или касанием — хоббит бросит камень по дуге</span>
      <span><kbd>R</kbd> начать заново</span>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const GROUND_Y = 454;
    const GRAVITY = 520;
    const TARGET_KILLS = 10;
    const THROW_DURATION = .58;
    const RELEASE_AT = .42;
    const THROW_COOLDOWN = 1.05;

    const hero = { x: 118, y: GROUND_Y, cooldown: 0, animation: null };
    const state = { mode: 'playing', kills: 0, goblins: [], stones: [], particles: [], spawnTimer: .65, elapsed: 0 };
    const pointer = { x: 660, y: 260, visible: false };
    let shake = 0;
    let lastTime = performance.now();

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const random = (min, max) => min + Math.random() * (max - min);

    function resetGame() {
      Object.assign(state, { mode: 'playing', kills: 0, goblins: [], stones: [], particles: [], spawnTimer: .65, elapsed: 0 });
      hero.cooldown = 0;
      hero.animation = null;
      shake = 0;
    }

    function spawnGoblin() {
      state.goblins.push({
        x: W + 45,
        y: GROUND_Y,
        speed: random(52, 73) + state.kills * 2,
        scale: random(.86, 1.08),
        phase: random(0, Math.PI * 2)
      });
    }

    function startThrow(targetX, targetY) {
      if (state.mode !== 'playing') { resetGame(); return; }
      if (hero.cooldown > 0 || hero.animation) return;
      const startX = hero.x + 27;
      // Не позволяем бросать назад: такой жест раньше создавал бесполезный камень за спиной героя.
      const safeX = clamp(targetX, startX + 55, W - 12);
      const safeY = clamp(targetY, 75, GROUND_Y - 8);
      hero.cooldown = THROW_COOLDOWN;
      hero.animation = { elapsed: 0, released: false, targetX: safeX, targetY: safeY };
    }

    function releaseStone(animation) {
      const startX = hero.x + 31;
      const startY = hero.y - 91;
      const dx = animation.targetX - startX;
      const dy = animation.targetY - startY;
      const flightTime = clamp(dx / 460, .55, 1.45);

      // Для программиста: скорость рассчитана из уравнения баллистики, поэтому камень действительно проходит через выбранную точку.
      state.stones.push({
        x: startX, y: startY, previousX: startX, previousY: startY,
        vx: dx / flightTime,
        vy: (dy - GRAVITY * flightTime * flightTime / 2) / flightTime,
        spin: 0
      });
    }

    function segmentDistanceSquared(x1, y1, x2, y2, px, py) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lengthSquared = dx * dx + dy * dy;
      const t = lengthSquared ? clamp(((px - x1) * dx + (py - y1) * dy) / lengthSquared, 0, 1) : 0;
      const nearestX = x1 + dx * t;
      const nearestY = y1 + dy * t;
      return (px - nearestX) ** 2 + (py - nearestY) ** 2;
    }

    function hitGoblin(goblin, stone) {
      const centerX = goblin.x;
      const centerY = goblin.y - 57 * goblin.scale;
      const radius = 31 * goblin.scale + 7;
      // Для программиста: проверяем весь отрезок пути за кадр, а не одну точку — быстрый камень не пролетает сквозь цель.
      return segmentDistanceSquared(stone.previousX, stone.previousY, stone.x, stone.y, centerX, centerY) <= radius * radius;
    }

    function impact(x, y) {
      shake = 6;
      const colors = ['#c7e66c', '#6d873f', '#f4d27b', '#4a382b'];
      for (let i = 0; i < 24; i += 1) {
        const angle = random(0, Math.PI * 2);
        const speed = random(35, 190);
        state.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 35, life: random(.3, .8), size: random(2, 6), color: colors[i % colors.length] });
      }
    }

    function update(dt) {
      state.elapsed += dt;
      hero.cooldown = Math.max(0, hero.cooldown - dt);

      if (state.mode === 'playing') {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnGoblin();
          state.spawnTimer = Math.max(.72, 1.46 - state.kills * .045) + random(-.12, .16);
        }

        if (hero.animation) {
          hero.animation.elapsed += dt;
          const progress = hero.animation.elapsed / THROW_DURATION;
          if (!hero.animation.released && progress >= RELEASE_AT) {
            releaseStone(hero.animation);
            hero.animation.released = true;
          }
          if (progress >= 1) hero.animation = null;
        }

        for (const stone of state.stones) {
          stone.previousX = stone.x;
          stone.previousY = stone.y;
          stone.vy += GRAVITY * dt;
          stone.x += stone.vx * dt;
          stone.y += stone.vy * dt;
          stone.spin += 11 * dt;
        }
        for (const goblin of state.goblins) goblin.x -= goblin.speed * dt;

        for (let goblinIndex = state.goblins.length - 1; goblinIndex >= 0; goblinIndex -= 1) {
          const goblin = state.goblins[goblinIndex];
          if (goblin.x < 167) {
            state.mode = 'lost';
            shake = 12;
            break;
          }
          for (let stoneIndex = state.stones.length - 1; stoneIndex >= 0; stoneIndex -= 1) {
            const stone = state.stones[stoneIndex];
            if (!hitGoblin(goblin, stone)) continue;
            state.goblins.splice(goblinIndex, 1);
            state.stones.splice(stoneIndex, 1);
            state.kills = Math.min(TARGET_KILLS, state.kills + 1);
            impact(stone.x, stone.y);
            if (state.kills >= TARGET_KILLS) state.mode = 'won';
            break;
          }
          if (state.mode !== 'playing') break;
        }

        // Для программиста: очищаем снаряды со всех сторон сцены, иначе выстрелы вверх/назад копились бесконечно.
        state.stones = state.stones.filter((stone) => stone.x > -50 && stone.x < W + 60 && stone.y > -180 && stone.y < H + 50);
      }

      for (const particle of state.particles) {
        particle.vy += 280 * dt;
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.life -= dt;
      }
      state.particles = state.particles.filter((particle) => particle.life > 0);
      shake = Math.max(0, shake - 30 * dt);
    }

    function drawBackground(time) {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#6c9ea7'); sky.addColorStop(.48, '#b9cab2'); sky.addColorStop(1, '#ecc98d');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      const sun = ctx.createRadialGradient(760, 100, 4, 760, 100, 96);
      sun.addColorStop(0, '#fffce1'); sun.addColorStop(.25, '#ffe7a4'); sun.addColorStop(1, '#ffe7a400');
      ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(760, 100, 96, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = .38;
      for (let i = 0; i < 6; i += 1) {
        const x = ((i * 211 + time * .006) % (W + 170)) - 85;
        const y = 76 + (i % 3) * 57;
        ctx.fillStyle = '#edf3db'; ctx.beginPath(); ctx.ellipse(x, y, 67, 14, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#4f6d58'; ctx.beginPath(); ctx.moveTo(0, 348);
      for (let x = 0; x <= W; x += 72) ctx.lineTo(x, 255 + Math.sin(x * .018) * 48);
      ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.fill();
      ctx.fillStyle = '#385542'; ctx.beginPath(); ctx.moveTo(0, 407);
      for (let x = 0; x <= W; x += 46) ctx.lineTo(x, 348 + Math.sin(x * .035 + .8) * 28);
      ctx.lineTo(W, GROUND_Y); ctx.lineTo(0, GROUND_Y); ctx.fill();

      // Для геймдизайнера: холм и нора образуют визуальную «линию обороны», совпадающую с механической границей поражения.
      ctx.fillStyle = '#567348'; ctx.beginPath(); ctx.ellipse(92, 447, 202, 106, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3d4f35'; ctx.fillRect(0, 409, 180, 75);
      ctx.fillStyle = '#70482e'; ctx.beginPath(); ctx.arc(68, 433, 49, Math.PI, 0); ctx.fillRect(19, 432, 98, 57); ctx.fill();
      ctx.strokeStyle = '#a97d48'; ctx.lineWidth = 6; ctx.stroke();
      ctx.fillStyle = '#e9bf55'; ctx.beginPath(); ctx.arc(68, 443, 25, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5e4028'; ctx.lineWidth = 4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(43, 443); ctx.lineTo(93, 443); ctx.moveTo(68, 418); ctx.lineTo(68, 468); ctx.stroke();

      const grass = ctx.createLinearGradient(0, GROUND_Y, 0, H);
      grass.addColorStop(0, '#42633b'); grass.addColorStop(1, '#17251c');
      ctx.fillStyle = grass; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      for (let x = 0; x < W; x += 16) {
        ctx.strokeStyle = `rgba(128, 168, 84, ${.25 + .12 * Math.sin(x)})`;
        ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 18); ctx.lineTo(x + Math.sin(time * .002 + x) * 4, GROUND_Y - 3 - (x * 11 % 9)); ctx.stroke();
      }
    }

    function limb(x, y, length, angle, width, color) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(angle) * length, y + Math.cos(angle) * length); ctx.stroke();
    }

    function drawHero() {
      const progress = hero.animation ? clamp(hero.animation.elapsed / THROW_DURATION, 0, 1) : 1;
      const wind = hero.animation ? (progress < RELEASE_AT ? progress / RELEASE_AT : Math.max(0, 1 - (progress - RELEASE_AT) / (1 - RELEASE_AT))) : 0;
      ctx.save(); ctx.translate(hero.x, hero.y);
      ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(0, 4, 37, 9, 0, 0, Math.PI * 2); ctx.fill();
      limb(-12, -39, 38, -.12, 12, '#725037'); limb(12, -39, 38, .12, 12, '#725037');
      ctx.fillStyle = '#587543'; ctx.beginPath(); ctx.roundRect(-28, -88, 56, 51, 14); ctx.fill();
      ctx.fillStyle = '#8c673e'; ctx.fillRect(-29, -49, 58, 8);
      limb(-20, -75, 34, -.75 + wind * .9, 11, '#d7a36c');
      const armAngle = .72 - wind * 2.25;
      limb(20, -76, 39, armAngle, 11, '#d7a36c');
      ctx.fillStyle = '#d9aa72'; ctx.beginPath(); ctx.arc(0, -106, 24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#57321f'; ctx.beginPath(); ctx.arc(0, -112, 26, Math.PI, Math.PI * 2); ctx.arc(-18, -108, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#364126'; ctx.beginPath(); ctx.moveTo(-29, -91); ctx.quadraticCurveTo(0, -128, 31, -91); ctx.lineTo(23, -84); ctx.quadraticCurveTo(0, -104, -24, -83); ctx.fill();
      ctx.fillStyle = '#2b211b'; ctx.beginPath(); ctx.arc(-8, -106, 2.5, 0, Math.PI * 2); ctx.arc(8, -106, 2.5, 0, Math.PI * 2); ctx.fill();
      if (hero.animation && !hero.animation.released) {
        const handX = 20 + Math.sin(armAngle) * 39;
        const handY = -76 + Math.cos(armAngle) * 39;
        ctx.fillStyle = '#77766d'; ctx.beginPath(); ctx.arc(handX, handY, 7, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawGoblin(goblin, time) {
      const walk = Math.sin(time * .01 * goblin.speed / 55 + goblin.phase);
      ctx.save(); ctx.translate(goblin.x, goblin.y); ctx.scale(goblin.scale, goblin.scale);
      ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(0, 4, 31, 8, 0, 0, Math.PI * 2); ctx.fill();
      limb(-12, -35, 36, walk * .62, 10, '#4c602e'); limb(12, -35, 36, -walk * .62, 10, '#4c602e');
      limb(-19, -61, 31, -walk * .7, 9, '#66813a'); limb(19, -61, 31, walk * .7, 9, '#66813a');
      ctx.fillStyle = '#4a382d'; ctx.beginPath(); ctx.roundRect(-25, -75, 50, 43, 11); ctx.fill();
      ctx.fillStyle = '#2d301d'; ctx.fillRect(-26, -42, 52, 8);
      ctx.fillStyle = '#728f42'; ctx.beginPath(); ctx.ellipse(0, -87, 25, 27, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, -94); ctx.lineTo(-42, -105); ctx.lineTo(-22, -81); ctx.moveTo(18, -94); ctx.lineTo(42, -105); ctx.lineTo(22, -81); ctx.fill();
      ctx.fillStyle = '#ffe05d'; ctx.beginPath(); ctx.ellipse(-9, -91, 4, 3, 0, 0, Math.PI * 2); ctx.ellipse(9, -91, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#31231c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -79, 11, .2, Math.PI - .2); ctx.stroke();
      ctx.restore();
    }

    function drawStone(stone) {
      ctx.save(); ctx.translate(stone.x, stone.y); ctx.rotate(stone.spin);
      ctx.shadowColor = '#fff0b0'; ctx.shadowBlur = 8;
      const gradient = ctx.createLinearGradient(-8, -5, 8, 5); gradient.addColorStop(0, '#b2aea0'); gradient.addColorStop(1, '#4e514d');
      ctx.fillStyle = gradient; ctx.beginPath(); ctx.ellipse(0, 0, 8, 6, .3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }

    function drawAim() {
      if (!pointer.visible || state.mode !== 'playing') return;
      ctx.save(); ctx.strokeStyle = '#fff0a5aa'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pointer.x - 18, pointer.y); ctx.lineTo(pointer.x + 18, pointer.y); ctx.moveTo(pointer.x, pointer.y - 18); ctx.lineTo(pointer.x, pointer.y + 18); ctx.stroke();
      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = '#101712c7'; ctx.beginPath(); ctx.roundRect(20, 18, 260, 48, 13); ctx.fill();
      ctx.font = '700 13px Inter, system-ui'; ctx.fillStyle = '#aaba9b'; ctx.fillText('ГОБЛИНЫ ОСТАНОВЛЕНЫ', 39, 37);
      ctx.font = '900 20px Inter, system-ui'; ctx.fillStyle = '#ffe39a'; ctx.fillText(`${state.kills} / ${TARGET_KILLS}`, 39, 59);

      const cooldownRatio = 1 - hero.cooldown / THROW_COOLDOWN;
      ctx.fillStyle = '#101712c7'; ctx.beginPath(); ctx.roundRect(W - 192, 18, 172, 48, 13); ctx.fill();
      ctx.font = '700 12px Inter, system-ui'; ctx.fillStyle = '#aaba9b'; ctx.fillText('БРОСОК', W - 172, 39);
      ctx.fillStyle = '#344235'; ctx.beginPath(); ctx.roundRect(W - 108, 33, 69, 8, 4); ctx.fill();
      ctx.fillStyle = cooldownRatio >= 1 ? '#f6d778' : '#78a560'; ctx.beginPath(); ctx.roundRect(W - 108, 33, 69 * clamp(cooldownRatio, 0, 1), 8, 4); ctx.fill();

      if (state.mode !== 'playing') {
        ctx.fillStyle = '#08100ddd'; ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center'; ctx.font = '900 57px Georgia, serif';
        ctx.fillStyle = state.mode === 'won' ? '#f7d678' : '#ef806d';
        ctx.fillText(state.mode === 'won' ? 'ХОЛМ ЗАЩИЩЁН' : 'ГОБЛИНЫ ПРОРВАЛИСЬ', W / 2, H / 2 - 25);
        ctx.fillStyle = '#d5d9c8'; ctx.font = '500 18px Inter, system-ui';
        ctx.fillText('Кликните или нажмите R, чтобы начать заново', W / 2, H / 2 + 25);
        ctx.textAlign = 'left';
      }
    }

    function draw(now) {
      ctx.save();
      if (shake > 0) ctx.translate(random(-shake, shake), random(-shake, shake));
      drawBackground(now);
      state.goblins.forEach((goblin) => drawGoblin(goblin, now));
      drawHero();
      state.stones.forEach(drawStone);
      for (const particle of state.particles) {
        ctx.globalAlpha = clamp(particle.life * 2, 0, 1); ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
      drawAim();
      drawHud();
      ctx.restore();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: (event.clientX - rect.left) * W / rect.width, y: (event.clientY - rect.top) * H / rect.height };
    }
    canvas.addEventListener('pointermove', (event) => Object.assign(pointer, canvasPoint(event), { visible: true }));
    canvas.addEventListener('pointerleave', () => { pointer.visible = false; });
    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const point = canvasPoint(event);
      Object.assign(pointer, point, { visible: true });
      startThrow(point.x, point.y);
    });
    addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'r' && !event.repeat) resetGame();
    });

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, .033);
      lastTime = now;
      update(dt);
      draw(now);
      requestAnimationFrame(gameLoop);
    }

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
  <script src="/game-audio.js"></script>
</body>
</html>
