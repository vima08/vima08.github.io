<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Invaders — Void Signal</title>
  <link rel="icon" href="/favicons/space-invaders.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --cyan: #64f2ff; --lime: #b7ff69; --rose: #ff6b91; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #eafaff; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, #173158 0, transparent 35%),
        radial-gradient(circle at 88% 78%, #31194b 0, transparent 38%),
        linear-gradient(145deg, #040712, #080817);
    }
    main { width: min(1020px, 100%); padding: clamp(12px, 2.6vw, 28px); }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 12px; }
    .brand small { display: block; margin-bottom: 3px; color: #7893ad; font-size: 11px; font-weight: 800; letter-spacing: .24em; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); letter-spacing: -.055em; }
    h1 span { color: var(--cyan); text-shadow: 0 0 25px #64f2ff77; }
    .hud { display: flex; flex-wrap: wrap; justify-content: end; gap: 8px; }
    .metric { min-width: 82px; padding: 7px 11px; border: 1px solid #ffffff16; border-radius: 11px; background: #080f21c7; color: #8299b2; font-size: 10px; letter-spacing: .12em; }
    .metric strong { display: block; margin-top: 2px; color: #edfaff; font-size: 18px; letter-spacing: 0; }
    .frame { position: relative; padding: 1px; border-radius: 23px; background: linear-gradient(130deg, #64f2ffaa, #ffffff10 47%, #b064ffaa); box-shadow: 0 30px 95px #000c, 0 0 48px #64f2ff16; }
    canvas { display: block; width: 100%; height: auto; border-radius: 22px; touch-action: none; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 12px; color: #94a8bd; font-size: 13px; }
    .actions, .touch-controls { display: flex; gap: 8px; }
    button, kbd { border: 1px solid #344961; border-radius: 7px; background: #101a2d; color: #dffcff; }
    button { padding: 7px 12px; cursor: pointer; font: inherit; }
    button:hover { border-color: #64f2ff88; background: #14243b; }
    kbd { padding: 2px 7px; border-bottom-width: 2px; }
    .touch-controls { display: none; margin-top: 12px; justify-content: center; }
    .touch-button { width: 72px; height: 58px; padding: 0; font-size: 22px; touch-action: none; user-select: none; }
    .touch-button.fire { width: 92px; color: var(--cyan); border-color: #64f2ff55; }
    @media (pointer: coarse) { .touch-controls { display: flex; } }
    @media (max-width: 700px) { header, .bar { align-items: start; flex-direction: column; } .hud { justify-content: start; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><small>SECTOR 08</small><h1>VOID <span>SIGNAL</span></h1></div>
      <div class="hud">
        <div class="metric">СЧЁТ<strong id="score">0</strong></div>
        <div class="metric">ЖИЗНИ<strong id="lives">3</strong></div>
        <div class="metric">ВОЛНА<strong id="wave">1</strong></div>
      </div>
    </header>
    <div class="frame">
      <canvas id="game" width="900" height="660" aria-label="Космический шутер Space Invaders"></canvas>
    </div>
    <div class="touch-controls" aria-label="Сенсорное управление">
      <button class="touch-button" id="btnLeft" type="button" aria-label="Влево">◀</button>
      <button class="touch-button fire" id="btnFire" type="button" aria-label="Огонь">ОГОНЬ</button>
      <button class="touch-button" id="btnRight" type="button" aria-label="Вправо">▶</button>
    </div>
    <div class="bar">
      <span><kbd>←</kbd> <kbd>→</kbd> движение · <kbd>Пробел</kbd> огонь · <kbd>P</kbd> пауза</span>
      <div class="actions"><button id="startBtn" type="button">Старт</button><button id="restartBtn" type="button">Рестарт</button></div>
    </div>
  </main>

  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const livesElement = document.getElementById('lives');
    const waveElement = document.getElementById('wave');
    const startButton = document.getElementById('startBtn');
    const restartButton = document.getElementById('restartBtn');
    const W = canvas.width;
    const H = canvas.height;

    const CONFIG = {
      playerSpeed: 430,
      playerBulletSpeed: 730,
      enemyBulletSpeed: 250,
      playerCooldown: .22,
      rows: 4,
      cols: 8,
      enemyWidth: 42,
      enemyHeight: 29,
      horizontalGap: 24,
      verticalGap: 20
    };

    const keys = new Set();
    const touch = { left: false, right: false, fire: false };
    const stars = Array.from({ length: 115 }, (_, index) => ({
      x: (index * 83.37) % W,
      y: (index * 47.71) % H,
      depth: .25 + (index % 5) * .17,
      size: index % 11 === 0 ? 2 : 1
    }));
    const particles = [];
    let player;
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let wave = 1;
    let gameState = 'intro';
    let formationDirection = 1;
    let formationBaseSpeed = 38;
    let enemyShotTimer = 1;
    let waveTimer = 0;
    let shake = 0;
    let lastTime = performance.now();

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const random = (min, max) => min + Math.random() * (max - min);

    function updateHud() {
      scoreElement.textContent = score;
      livesElement.textContent = lives;
      waveElement.textContent = wave;
      startButton.disabled = gameState === 'playing' || gameState === 'paused' || gameState === 'wave';
    }

    function createPlayer() {
      player = { x: W / 2, y: H - 52, w: 54, h: 32, cooldown: 0, invulnerable: 0 };
    }

    function spawnEnemies() {
      enemies = [];
      const formationWidth = CONFIG.cols * CONFIG.enemyWidth + (CONFIG.cols - 1) * CONFIG.horizontalGap;
      const startX = (W - formationWidth) / 2;
      const startY = 78;
      for (let row = 0; row < CONFIG.rows; row += 1) {
        for (let col = 0; col < CONFIG.cols; col += 1) {
          enemies.push({
            x: startX + col * (CONFIG.enemyWidth + CONFIG.horizontalGap),
            y: startY + row * (CONFIG.enemyHeight + CONFIG.verticalGap),
            w: CONFIG.enemyWidth,
            h: CONFIG.enemyHeight,
            row,
            col
          });
        }
      }
      formationDirection = 1;
      formationBaseSpeed = 38 + (wave - 1) * 7;
      enemyShotTimer = random(.55, 1.25);
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      bullets = [];
      enemyBullets = [];
      particles.length = 0;
      createPlayer();
      spawnEnemies();
      gameState = 'playing';
      waveTimer = 0;
      shake = 0;
      updateHud();
    }

    function startNextWave() {
      wave += 1;
      bullets = [];
      enemyBullets = [];
      player.x = W / 2;
      player.invulnerable = .8;
      spawnEnemies();
      gameState = 'playing';
      waveTimer = 0;
      updateHud();
    }

    function rectanglesOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function sweptBulletBounds(bullet) {
      return {
        x: bullet.x,
        y: Math.min(bullet.previousY, bullet.y),
        w: bullet.w,
        h: Math.abs(bullet.y - bullet.previousY) + bullet.h
      };
    }

    function explode(x, y, color, amount = 18) {
      for (let i = 0; i < amount; i += 1) {
        const angle = random(0, Math.PI * 2);
        const speed = random(45, 230);
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: random(.3, .85), size: random(2, 6), color });
      }
    }

    function firePlayer() {
      if (player.cooldown > 0 || gameState !== 'playing') return;
      player.cooldown = CONFIG.playerCooldown;
      bullets.push({ x: player.x - 3, y: player.y - 28, previousY: player.y - 28, w: 6, h: 17, vy: -CONFIG.playerBulletSpeed });
    }

    function bottomShooters() {
      const shooters = [];
      for (let col = 0; col < CONFIG.cols; col += 1) {
        const column = enemies.filter((enemy) => enemy.col === col);
        if (column.length) shooters.push(column.reduce((lowest, enemy) => enemy.y > lowest.y ? enemy : lowest));
      }
      return shooters;
    }

    function fireEnemy() {
      const shooters = bottomShooters();
      if (!shooters.length) return;
      // Для геймдизайнера: стреляет только нижний пришелец колонки — пули читаются, а строй остаётся честным.
      const nearby = shooters.filter((enemy) => Math.abs(enemy.x + enemy.w / 2 - player.x) < 240);
      const pool = nearby.length ? nearby : shooters;
      const shooter = pool[Math.floor(Math.random() * pool.length)];
      enemyBullets.push({ x: shooter.x + shooter.w / 2 - 3, y: shooter.y + shooter.h, previousY: shooter.y + shooter.h, w: 6, h: 16, vy: CONFIG.enemyBulletSpeed + wave * 9 });
    }

    function updateFormation(dt) {
      if (!enemies.length) return;
      const leftEdge = Math.min(...enemies.map((enemy) => enemy.x));
      const rightEdge = Math.max(...enemies.map((enemy) => enemy.x + enemy.w));
      const defeated = CONFIG.rows * CONFIG.cols - enemies.length;
      const speed = formationBaseSpeed + defeated * 2.1;
      const move = speed * formationDirection * dt;
      const crossesEdge = leftEdge + move < 18 || rightEdge + move > W - 18;

      // Для программиста: при касании края строй сначала опускается и меняет направление — без многократного «дребезга» у стены.
      if (crossesEdge) {
        formationDirection *= -1;
        enemies.forEach((enemy) => { enemy.y += 21; });
      } else {
        enemies.forEach((enemy) => { enemy.x += move; });
      }
    }

    function damagePlayer(hitX, hitY) {
      if (player.invulnerable > 0 || gameState !== 'playing') return;
      lives = Math.max(0, lives - 1);
      player.invulnerable = 1.15;
      shake = 12;
      explode(hitX, hitY, '#ff6b91', 34);
      // После попадания очищаем ближайший залп, чтобы несколько наложенных пуль не сняли все жизни за один кадр.
      enemyBullets = enemyBullets.filter((bullet) => Math.abs(bullet.y - player.y) > 85);
      if (lives === 0) gameState = 'lost';
      updateHud();
    }

    function updateBullets(dt) {
      for (const bullet of bullets) {
        bullet.previousY = bullet.y;
        bullet.y += bullet.vy * dt;
      }
      for (const bullet of enemyBullets) {
        bullet.previousY = bullet.y;
        bullet.y += bullet.vy * dt;
      }

      // Идём с конца: удаление из массива больше не пропускает соседние цели и снаряды.
      for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex -= 1) {
        const bullet = bullets[bulletIndex];
        const bounds = sweptBulletBounds(bullet);
        let hitIndex = -1;
        for (let enemyIndex = enemies.length - 1; enemyIndex >= 0; enemyIndex -= 1) {
          if (rectanglesOverlap(bounds, enemies[enemyIndex])) { hitIndex = enemyIndex; break; }
        }
        if (hitIndex >= 0) {
          const enemy = enemies[hitIndex];
          bullets.splice(bulletIndex, 1);
          enemies.splice(hitIndex, 1);
          score += 10;
          shake = 3;
          explode(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, ['#b7ff69', '#64f2ff', '#d88aff', '#ff9d6c'][enemy.row], 20);
        } else if (bullet.y + bullet.h < -20) {
          bullets.splice(bulletIndex, 1);
        }
      }

      const playerBounds = { x: player.x - player.w / 2, y: player.y - player.h / 2, w: player.w, h: player.h };
      for (let index = enemyBullets.length - 1; index >= 0; index -= 1) {
        const bullet = enemyBullets[index];
        if (rectanglesOverlap(sweptBulletBounds(bullet), playerBounds)) {
          enemyBullets.splice(index, 1);
          damagePlayer(bullet.x, bullet.y);
          // damagePlayer очищает опасную зону новым массивом; выходим, чтобы не продолжить со старыми индексами.
          break;
        } else if (bullet.y > H + 25) {
          enemyBullets.splice(index, 1);
        }
      }
      updateHud();
    }

    function updateParticles(dt) {
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= Math.pow(.035, dt);
        particle.vy *= Math.pow(.035, dt);
        particle.life -= dt;
      }
      for (let i = particles.length - 1; i >= 0; i -= 1) if (particles[i].life <= 0) particles.splice(i, 1);
      shake = Math.max(0, shake - 28 * dt);
    }

    function update(dt) {
      if (gameState === 'wave') {
        waveTimer -= dt;
        if (waveTimer <= 0) startNextWave();
        updateParticles(dt);
        return;
      }
      if (gameState !== 'playing') {
        updateParticles(dt);
        return;
      }

      player.cooldown = Math.max(0, player.cooldown - dt);
      player.invulnerable = Math.max(0, player.invulnerable - dt);
      const direction = ((keys.has('ArrowRight') || touch.right) ? 1 : 0) - ((keys.has('ArrowLeft') || touch.left) ? 1 : 0);
      player.x = clamp(player.x + direction * CONFIG.playerSpeed * dt, 18 + player.w / 2, W - 18 - player.w / 2);
      if (keys.has('Space') || touch.fire) firePlayer();

      updateFormation(dt);
      enemyShotTimer -= dt;
      if (enemyShotTimer <= 0) {
        fireEnemy();
        enemyShotTimer = random(Math.max(.34, 1.05 - wave * .05), Math.max(.62, 1.65 - wave * .06));
      }
      updateBullets(dt);

      // Последний выстрел врага может одновременно завершить игру и волну: поражение всегда имеет приоритет.
      if (gameState !== 'playing') {
        updateParticles(dt);
        return;
      }

      if (enemies.some((enemy) => enemy.y + enemy.h >= player.y - player.h / 2)) {
        lives = 0;
        gameState = 'lost';
        explode(player.x, player.y, '#ff6b91', 48);
        updateHud();
      } else if (!enemies.length) {
        gameState = 'wave';
        waveTimer = 1.35;
        enemyBullets = [];
        explode(W / 2, H / 2, '#b7ff69', 52);
      }
      updateParticles(dt);
    }

    function drawSpace(time) {
      const space = ctx.createLinearGradient(0, 0, 0, H);
      space.addColorStop(0, '#060c21'); space.addColorStop(.55, '#090a1a'); space.addColorStop(1, '#130d22');
      ctx.fillStyle = space; ctx.fillRect(0, 0, W, H);

      const planetGlow = ctx.createRadialGradient(735, 115, 8, 735, 115, 145);
      planetGlow.addColorStop(0, '#c6ecff'); planetGlow.addColorStop(.28, '#547bd3aa'); planetGlow.addColorStop(.62, '#392c7950'); planetGlow.addColorStop(1, '#392c7900');
      ctx.fillStyle = planetGlow; ctx.beginPath(); ctx.arc(735, 115, 145, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = .28;
      for (const star of stars) {
        const y = (star.y + time * .012 * star.depth) % H;
        ctx.fillStyle = star.size > 1 ? '#8decff' : '#ffffff';
        ctx.fillRect(star.x, y, star.size, star.size);
      }
      ctx.globalAlpha = 1;

      const horizon = ctx.createLinearGradient(0, H - 130, 0, H);
      horizon.addColorStop(0, '#5cf1ff00'); horizon.addColorStop(1, '#5cf1ff16');
      ctx.fillStyle = horizon; ctx.fillRect(0, H - 130, W, 130);
      ctx.strokeStyle = '#64f2ff20'; ctx.lineWidth = 1;
      for (let x = -100; x < W + 100; x += 48) { ctx.beginPath(); ctx.moveTo(W / 2, H - 90); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = H - 80; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }

    function drawPlayer(time) {
      if (player.invulnerable > 0 && Math.floor(time / 80) % 2 === 0) return;
      ctx.save(); ctx.translate(player.x, player.y);
      ctx.shadowColor = '#64f2ff'; ctx.shadowBlur = 24;
      const flame = 11 + Math.sin(time * .035) * 4;
      const flameGradient = ctx.createLinearGradient(0, 12, 0, 12 + flame);
      flameGradient.addColorStop(0, '#ffffff'); flameGradient.addColorStop(.3, '#64f2ff'); flameGradient.addColorStop(1, '#795cff00');
      ctx.fillStyle = flameGradient; ctx.beginPath(); ctx.moveTo(-8, 10); ctx.quadraticCurveTo(0, 12 + flame, 8, 10); ctx.fill();

      const hull = ctx.createLinearGradient(-28, 0, 28, 0);
      hull.addColorStop(0, '#246681'); hull.addColorStop(.45, '#e6fdff'); hull.addColorStop(.6, '#69efff'); hull.addColorStop(1, '#214f75');
      ctx.fillStyle = hull; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(11, -5); ctx.lineTo(28, 8); ctx.lineTo(24, 16); ctx.lineTo(7, 11); ctx.lineTo(0, 17); ctx.lineTo(-7, 11); ctx.lineTo(-24, 16); ctx.lineTo(-28, 8); ctx.lineTo(-11, -5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#17285a'; ctx.beginPath(); ctx.ellipse(0, -7, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b7ffef'; ctx.beginPath(); ctx.ellipse(0, -10, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawEnemy(enemy, time) {
      const palette = ['#b7ff69', '#64f2ff', '#d88aff', '#ff9d6c'];
      const color = palette[enemy.row];
      const pulse = Math.sin(time * .008 + enemy.col) * 1.5;
      ctx.save(); ctx.translate(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2 + pulse);
      ctx.shadowColor = color; ctx.shadowBlur = 13;
      ctx.fillStyle = color;
      if (enemy.row === 0) {
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(20, 4); ctx.lineTo(11, 14); ctx.lineTo(-11, 14); ctx.lineTo(-20, 4); ctx.closePath(); ctx.fill();
      } else if (enemy.row === 1) {
        ctx.beginPath(); ctx.roundRect(-20, -11, 40, 23, 9); ctx.fill();
        ctx.fillRect(-24, 2, 8, 8); ctx.fillRect(16, 2, 8, 8);
      } else {
        ctx.beginPath(); ctx.ellipse(0, 0, 20, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(-17, 6, 7, 11); ctx.fillRect(10, 6, 7, 11);
      }
      ctx.shadowBlur = 0; ctx.fillStyle = '#07111f';
      ctx.beginPath(); ctx.ellipse(-7, -2, 3.5, 4, 0, 0, Math.PI * 2); ctx.ellipse(7, -2, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-7, -3, 1.5, 2); ctx.fillRect(7, -3, 1.5, 2);
      ctx.restore();
    }

    function drawBullets() {
      ctx.save(); ctx.shadowBlur = 15;
      for (const bullet of bullets) {
        ctx.shadowColor = '#b7ffef';
        const gradient = ctx.createLinearGradient(0, bullet.y, 0, bullet.y + bullet.h);
        gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(1, '#52f2d0');
        ctx.fillStyle = gradient; ctx.beginPath(); ctx.roundRect(bullet.x, bullet.y, bullet.w, bullet.h, 3); ctx.fill();
      }
      for (const bullet of enemyBullets) {
        ctx.shadowColor = '#ff6b91'; ctx.fillStyle = '#ff789a';
        ctx.beginPath(); ctx.roundRect(bullet.x, bullet.y, bullet.w, bullet.h, 3); ctx.fill();
      }
      ctx.restore();
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = clamp(particle.life * 2, 0, 1);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawOverlay() {
      if (gameState === 'playing') return;
      if (gameState === 'wave') {
        ctx.textAlign = 'center'; ctx.fillStyle = '#b7ff69'; ctx.font = '900 42px Inter, system-ui';
        ctx.fillText('СЕКТОР ОЧИЩЕН', W / 2, H / 2); ctx.textAlign = 'left'; return;
      }
      ctx.fillStyle = '#030611d7'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      const title = gameState === 'intro' ? 'VOID SIGNAL' : gameState === 'paused' ? 'ПАУЗА' : 'КОРАБЛЬ ПОТЕРЯН';
      ctx.fillStyle = gameState === 'lost' ? '#ff6b91' : '#dffcff'; ctx.font = '900 58px Inter, system-ui';
      ctx.fillText(title, W / 2, H / 2 - 34);
      ctx.fillStyle = '#98adc2'; ctx.font = '500 17px Inter, system-ui';
      ctx.fillText(gameState === 'intro' ? 'Защитите орбиту. Нажмите «Старт»' : gameState === 'paused' ? 'Нажмите P, чтобы продолжить' : 'Нажмите «Рестарт», чтобы вернуться в бой', W / 2, H / 2 + 20);
      ctx.textAlign = 'left';
    }

    function render(now) {
      ctx.save();
      if (shake > 0) ctx.translate(random(-shake, shake), random(-shake, shake));
      drawSpace(now);
      enemies.forEach((enemy) => drawEnemy(enemy, now));
      drawBullets();
      if (player) drawPlayer(now);
      drawParticles();
      drawOverlay();
      ctx.restore();
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, .033);
      lastTime = now;
      if (gameState !== 'paused') update(dt);
      render(now);
      requestAnimationFrame(gameLoop);
    }

    addEventListener('keydown', (event) => {
      if (['ArrowLeft', 'ArrowRight', 'Space', 'KeyP'].includes(event.code)) event.preventDefault();
      if (event.code === 'KeyP' && !event.repeat && (gameState === 'playing' || gameState === 'paused')) {
        gameState = gameState === 'playing' ? 'paused' : 'playing';
        updateHud();
      }
      keys.add(event.code);
    });
    addEventListener('keyup', (event) => keys.delete(event.code));
    addEventListener('blur', () => keys.clear());

    function bindHold(button, property) {
      const release = () => { touch[property] = false; };
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touch[property] = true;
      });
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    }
    bindHold(document.getElementById('btnLeft'), 'left');
    bindHold(document.getElementById('btnRight'), 'right');
    bindHold(document.getElementById('btnFire'), 'fire');

    startButton.addEventListener('click', () => {
      if (gameState === 'intro' || gameState === 'lost') resetGame();
    });
    restartButton.addEventListener('click', resetGame);

    createPlayer();
    spawnEnemies();
