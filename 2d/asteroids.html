<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroids — Deep Signal</title>
    <link rel="icon" href="/favicons/asteroids.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; --cyan: #68e4ff; --violet: #a58cff; --ink: #edf7ff; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% -10%, rgba(94, 83, 190, 0.28), transparent 40rem),
          #03050d;
        color: var(--ink);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      main { width: min(96vw, 900px); padding: 24px 0 30px; text-align: center; }
      .eyebrow { margin: 0; color: var(--cyan); font-size: .7rem; font-weight: 900; letter-spacing: .28em; text-transform: uppercase; }
      h1 { margin: 2px 0 6px; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1; letter-spacing: -.06em; }
      .subtitle { margin: 0 0 16px; color: #91a5bd; font-size: .9rem; }
      .frame {
        position: relative;
        padding: 9px;
        overflow: hidden;
        border: 1px solid rgba(120, 216, 255, .25);
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(23, 35, 61, .88), rgba(8, 12, 25, .94));
        box-shadow: 0 30px 90px rgba(0, 0, 0, .62), inset 0 1px rgba(255,255,255,.08);
      }
      canvas { display: block; width: 100%; height: auto; border-radius: 16px; background: #030713; touch-action: none; }
      .hud {
        position: absolute;
        inset: 21px 24px auto;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        color: #96adc6;
        font-size: .65rem;
        font-weight: 850;
        letter-spacing: .16em;
        text-transform: uppercase;
        text-shadow: 0 2px 8px #000;
      }
      .hud strong { display: block; margin-top: 2px; color: #fff; font-size: 1.25rem; letter-spacing: .04em; }
      .controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
      button {
        min-width: 54px;
        min-height: 44px;
        padding: 9px 16px;
        border: 1px solid rgba(104, 228, 255, .32);
        border-radius: 14px;
        background: rgba(25, 45, 70, .7);
        color: var(--ink);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }
      button:hover, button.is-active { border-color: var(--cyan); background: rgba(59, 118, 151, .5); }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      .fire { min-width: 96px; color: #ffe9bb; border-color: rgba(255, 204, 112, .48); }
      @media (min-width: 760px) { .controls { opacity: .72; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Deep signal</p>
      <h1>Asteroids</h1>
      <p class="subtitle">Arrows / A D to steer · W to thrust · Space to fire · P to pause</p>
      <section class="frame" aria-label="Asteroids game">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="hud" aria-live="polite">
          <span>Signal<strong id="scoreValue">0</strong></span>
          <span>Record<strong id="bestValue">0</strong></span>
        </div>
      </section>
      <div class="controls" aria-label="Touch controls">
        <button type="button" data-control="ArrowLeft" aria-label="Rotate left">↺</button>
        <button type="button" data-control="ArrowUp" aria-label="Thrust">▲</button>
        <button type="button" data-control="ArrowRight" aria-label="Rotate right">↻</button>
        <button class="fire" type="button" data-control="Space">Fire</button>
      </div>
    </main>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreValue = document.getElementById('scoreValue');
      const bestValue = document.getElementById('bestValue');

      const WORLD = { width: canvas.width, height: canvas.height };
      const SHIP_RADIUS = 12;
      const TARGET_ASTEROIDS = 7;
      const keys = Object.create(null);
      const stars = Array.from({ length: 105 }, () => ({
        x: Math.random() * WORLD.width,
        y: Math.random() * WORLD.height,
        radius: 0.35 + Math.random() * 1.25,
        alpha: 0.25 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2,
      }));

      let ship;
      let shots;
      let asteroids;
      let particles;
      let score = 0;
      let best = Number(localStorage.getItem('asteroidsBest') || 0);
      let fireCooldown = 0;
      let respawnGrace = 0;
      let paused = false;
      let elapsed = 0;

      bestValue.textContent = String(best);

      function resetShip() {
        ship = { x: WORLD.width / 2, y: WORLD.height / 2, angle: -Math.PI / 2, vx: 0, vy: 0 };
        respawnGrace = 1.8;
      }

      function randomEdgePosition(margin) {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) return { x: Math.random() * WORLD.width, y: -margin };
        if (edge === 1) return { x: WORLD.width + margin, y: Math.random() * WORLD.height };
        if (edge === 2) return { x: Math.random() * WORLD.width, y: WORLD.height + margin };
        return { x: -margin, y: Math.random() * WORLD.height };
      }

      function createAsteroid() {
        const radius = 22 + Math.random() * 22;
        const position = randomEdgePosition(radius);
        const aim = Math.atan2(WORLD.height / 2 - position.y, WORLD.width / 2 - position.x);
        const speed = 32 + Math.random() * 42;
        const vertices = Array.from({ length: 10 }, (_, index) => ({
          angle: (index / 10) * Math.PI * 2,
          scale: 0.72 + Math.random() * 0.34,
        }));
        return {
          ...position,
          vx: Math.cos(aim + (Math.random() - 0.5) * 0.65) * speed,
          vy: Math.sin(aim + (Math.random() - 0.5) * 0.65) * speed,
          radius,
          rotation: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.8,
          hue: 24 + Math.random() * 22,
          vertices,
          craters: Array.from({ length: 3 }, () => ({
            x: (Math.random() - 0.5) * radius,
            y: (Math.random() - 0.5) * radius,
            r: 2 + Math.random() * radius * 0.13,
          })),
        };
      }

      function resetRun() {
        score = 0;
        shots = [];
        particles = [];
        resetShip();
        asteroids = Array.from({ length: TARGET_ASTEROIDS }, createAsteroid);
        updateHud();
      }

      function updateHud() {
        scoreValue.textContent = String(score).padStart(4, '0');
        bestValue.textContent = String(best).padStart(4, '0');
      }

      function wrap(entity, margin = 0) {
        if (entity.x < -margin) entity.x = WORLD.width + margin;
        else if (entity.x > WORLD.width + margin) entity.x = -margin;
        if (entity.y < -margin) entity.y = WORLD.height + margin;
        else if (entity.y > WORLD.height + margin) entity.y = -margin;
      }

      function wrappedDistance(a, b) {
        // Для программиста: расстояние считается на торе, поэтому выстрел у правого края
        // корректно попадает в астероид, уже показавшийся слева.
        const directX = Math.abs(a.x - b.x);
        const directY = Math.abs(a.y - b.y);
        const dx = Math.min(directX, WORLD.width - directX);
        const dy = Math.min(directY, WORLD.height - directY);
        return Math.hypot(dx, dy);
      }

      function fire() {
        if (fireCooldown > 0 || shots.length >= 12) return;
        const noseX = Math.cos(ship.angle);
        const noseY = Math.sin(ship.angle);
        shots.push({
          x: ship.x + noseX * 15,
          y: ship.y + noseY * 15,
          vx: ship.vx + noseX * 430,
          vy: ship.vy + noseY * 430,
          life: 1.15,
        });
        fireCooldown = 0.17;
        spawnBurst(ship.x + noseX * 14, ship.y + noseY * 14, '#ffe6a1', 3, 65);
      }

      function spawnBurst(x, y, color, count = 16, speed = 125) {
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const velocity = speed * (0.35 + Math.random() * 0.85);
          particles.push({ x, y, vx: Math.cos(angle) * velocity, vy: Math.sin(angle) * velocity, life: 0.45 + Math.random() * 0.5, maxLife: 1, color, size: 1 + Math.random() * 2.4 });
        }
      }

      function handleShipInput(dt) {
        if (keys.ArrowLeft || keys.KeyA) ship.angle -= 3.3 * dt;
        if (keys.ArrowRight || keys.KeyD) ship.angle += 3.3 * dt;
        if (keys.ArrowUp || keys.KeyW) {
          ship.vx += Math.cos(ship.angle) * 145 * dt;
          ship.vy += Math.sin(ship.angle) * 145 * dt;
        }
        if (keys.Space) fire();

        const speed = Math.hypot(ship.vx, ship.vy);
        if (speed > 275) {
          ship.vx = (ship.vx / speed) * 275;
          ship.vy = (ship.vy / speed) * 275;
        }
      }

      function update(dt) {
        if (paused) return;
        elapsed += dt;
        fireCooldown = Math.max(0, fireCooldown - dt);
        respawnGrace = Math.max(0, respawnGrace - dt);
        handleShipInput(dt);

        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;
        const drag = Math.pow(0.985, dt * 60);
        ship.vx *= drag;
        ship.vy *= drag;
        wrap(ship);

        shots.forEach((shot) => {
          shot.x += shot.vx * dt;
          shot.y += shot.vy * dt;
          shot.life -= dt;
          wrap(shot);
        });
        shots = shots.filter(({ life }) => life > 0);

        asteroids.forEach((asteroid) => {
          asteroid.x += asteroid.vx * dt;
          asteroid.y += asteroid.vy * dt;
          asteroid.rotation += asteroid.spin * dt;
          wrap(asteroid, asteroid.radius);
        });

        particles.forEach((particle) => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(0.96, dt * 60);
          particle.vy *= Math.pow(0.96, dt * 60);
          particle.life -= dt;
          wrap(particle);
        });
        particles = particles.filter(({ life }) => life > 0);

        for (let asteroidIndex = asteroids.length - 1; asteroidIndex >= 0; asteroidIndex -= 1) {
          const asteroid = asteroids[asteroidIndex];
          const shotIndex = shots.findIndex((shot) => wrappedDistance(asteroid, shot) < asteroid.radius + 2);
          if (shotIndex !== -1) {
            shots.splice(shotIndex, 1);
            asteroids.splice(asteroidIndex, 1);
            score += 10;
            best = Math.max(best, score);
            localStorage.setItem('asteroidsBest', String(best));
            spawnBurst(asteroid.x, asteroid.y, `hsl(${asteroid.hue} 80% 68%)`, 20, 145);
            updateHud();
            continue;
          }

          if (respawnGrace === 0 && wrappedDistance(asteroid, ship) < asteroid.radius + SHIP_RADIUS) {
            // Для геймдизайнера: после столкновения опасный астероид убирается, а короткая
            // неуязвимость исключает цепочку мгновенных смертей в точке возрождения.
            spawnBurst(ship.x, ship.y, '#7ceaff', 30, 190);
            asteroids.splice(asteroidIndex, 1);
            score = 0;
            resetShip();
            updateHud();
          }
        }

        // Астероиды не уничтожают друг друга: это сохраняет понятную плотность угрозы.
        while (asteroids.length < TARGET_ASTEROIDS) asteroids.push(createAsteroid());
      }

      function drawSpace() {
        const space = ctx.createLinearGradient(0, 0, 0, WORLD.height);
        space.addColorStop(0, '#070c20');
        space.addColorStop(0.55, '#030816');
        space.addColorStop(1, '#070510');
        ctx.fillStyle = space;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);

        const nebula = ctx.createRadialGradient(610, 130, 10, 610, 130, 260);
        nebula.addColorStop(0, 'rgba(94, 67, 179, .18)');
        nebula.addColorStop(1, 'rgba(12, 15, 38, 0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, WORLD.width, WORLD.height);

        stars.forEach((star) => {
          ctx.globalAlpha = star.alpha * (0.72 + Math.sin(elapsed * 1.7 + star.phase) * 0.28);
          ctx.fillStyle = star.radius > 1.1 ? '#c8eaff' : '#fff';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawShip() {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.globalAlpha = respawnGrace > 0 && Math.floor(respawnGrace * 10) % 2 ? 0.34 : 1;

        if (keys.ArrowUp || keys.KeyW) {
          const flame = 13 + Math.sin(elapsed * 45) * 4;
          const flameGradient = ctx.createLinearGradient(-8, 0, -flame - 8, 0);
          flameGradient.addColorStop(0, '#fdf1b5');
          flameGradient.addColorStop(0.35, '#ff8d55');
          flameGradient.addColorStop(1, 'rgba(100,110,255,0)');
          ctx.fillStyle = flameGradient;
          ctx.beginPath();
          ctx.moveTo(-7, -5); ctx.lineTo(-flame - 8, 0); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill();
        }

        ctx.shadowColor = '#6de8ff';
        ctx.shadowBlur = 13;
        const hull = ctx.createLinearGradient(-10, -10, 14, 8);
        hull.addColorStop(0, '#6e87a5');
        hull.addColorStop(0.45, '#ecfaff');
        hull.addColorStop(1, '#5caac0');
        ctx.fillStyle = hull;
        ctx.strokeStyle = '#bff5ff';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(16, 0); ctx.lineTo(-11, 10); ctx.lineTo(-6, 0); ctx.lineTo(-11, -10); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#312b62';
        ctx.beginPath(); ctx.ellipse(2, 0, 5, 3.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawAsteroid(asteroid) {
        ctx.save();
        ctx.translate(asteroid.x, asteroid.y);
        ctx.rotate(asteroid.rotation);
        ctx.shadowColor = 'rgba(255, 166, 92, .18)';
        ctx.shadowBlur = 14;
        const rock = ctx.createRadialGradient(-asteroid.radius * .3, -asteroid.radius * .35, 2, 0, 0, asteroid.radius);
        rock.addColorStop(0, `hsl(${asteroid.hue} 32% 55%)`);
        rock.addColorStop(0.55, `hsl(${asteroid.hue} 27% 35%)`);
        rock.addColorStop(1, `hsl(${asteroid.hue} 28% 17%)`);
        ctx.fillStyle = rock;
        ctx.strokeStyle = `hsl(${asteroid.hue} 38% 63%)`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        asteroid.vertices.forEach((point, index) => {
          const x = Math.cos(point.angle) * asteroid.radius * point.scale;
          const y = Math.sin(point.angle) * asteroid.radius * point.scale;
          if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        asteroid.craters.forEach((crater) => {
          ctx.fillStyle = 'rgba(25, 14, 17, .35)';
          ctx.beginPath(); ctx.arc(crater.x, crater.y, crater.r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(255, 207, 153, .16)'; ctx.stroke();
        });
        ctx.restore();
      }

      function draw() {
        drawSpace();
        asteroids.forEach(drawAsteroid);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        shots.forEach((shot) => {
          ctx.shadowColor = '#c7f8ff'; ctx.shadowBlur = 11; ctx.fillStyle = '#efffff';
          ctx.beginPath(); ctx.arc(shot.x, shot.y, 2.2, 0, Math.PI * 2); ctx.fill();
        });
        particles.forEach((particle) => {
          ctx.globalAlpha = Math.min(1, particle.life * 2);
          ctx.fillStyle = particle.color;
          ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.restore();
        drawShip();

        if (paused) {
          ctx.fillStyle = 'rgba(2, 5, 14, .7)'; ctx.fillRect(0, 0, WORLD.width, WORLD.height);
          ctx.fillStyle = '#eefaff'; ctx.textAlign = 'center'; ctx.font = '800 38px Inter, sans-serif';
          ctx.fillText('Signal paused', WORLD.width / 2, WORLD.height / 2);
          ctx.fillStyle = '#91a9c2'; ctx.font = '15px Inter, sans-serif';
          ctx.fillText('Press P to resume', WORLD.width / 2, WORLD.height / 2 + 30);
          ctx.textAlign = 'start';
        }
      }

      window.addEventListener('keydown', (event) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(event.code)) event.preventDefault();
        if (event.code === 'KeyP' && !event.repeat) paused = !paused;
        keys[event.code] = true;
      });
      window.addEventListener('keyup', (event) => { keys[event.code] = false; });
      window.addEventListener('blur', () => {
        Object.keys(keys).forEach((key) => { keys[key] = false; });
      });

      document.querySelectorAll('[data-control]').forEach((button) => {
        const code = button.dataset.control;
        const release = () => { keys[code] = false; button.classList.remove('is-active'); };
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          keys[code] = true;
          button.classList.add('is-active');
          button.setPointerCapture?.(event.pointerId);
        });
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) paused = true;
      });

      // Для программиста: вся физика получает dt в секундах; clamp не даёт объектам
      // «протелепортироваться» после подвисания вкладки.
      let previousTime = performance.now();
      function frame(now) {
        const dt = Math.min((now - previousTime) / 1000, 1 / 20);
        previousTime = now;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      resetRun();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
