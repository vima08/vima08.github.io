<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>3D Space Invaders</title>
<style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#020510}#game{position:fixed;inset:0}.hud{position:fixed;z-index:2;top:16px;left:16px;width:min(410px,calc(100vw - 32px));padding:15px 18px;border:1px solid #57ff9955;border-radius:14px;background:#04100dcc;backdrop-filter:blur(8px)}h1{margin:0 0 7px;font-size:24px}p{margin:6px 0;color:#c7efdd;line-height:1.35}#status{color:#fff;font-weight:bold}a{color:#77ffc2}</style></head>
<body><div id="game"></div><section class="hud"><h1>3D Space Invaders</h1><p>Move: ← → or A D &nbsp; Fire: Space &nbsp; Reset: R</p><p>Defend the glowing outpost from the descending fleet.</p><p id="status"></p><p><a href="/index.html">← Back to games</a></p></section>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020510);scene.fog=new THREE.FogExp2(0x020510,.025);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);camera.position.set(0,15,19);camera.lookAt(0,0,-5);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x88aaff,0x030307,1.5));
const starsGeo=new THREE.BufferGeometry(),points=[];for(let i=0;i<500;i++)points.push((Math.random()-.5)*80,Math.random()*35-2,-Math.random()*70+10);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(points,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xffffff,size:.08})));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(34,42),new THREE.MeshStandardMaterial({color:0x07152a,roughness:.75,metalness:.35}));ground.rotation.x=-Math.PI/2;ground.position.y=-.6;ground.position.z=-5;scene.add(ground);const grid=new THREE.GridHelper(40,40,0x1bff86,0x12305a);grid.position.y=-.55;grid.position.z=-5;scene.add(grid);
const ship=new THREE.Group();const shipMat=new THREE.MeshStandardMaterial({color:0x41f59a,emissive:0x0a5d39});const hull=new THREE.Mesh(new THREE.BoxGeometry(2.6,.65,1.2),shipMat),nose=new THREE.Mesh(new THREE.ConeGeometry(.55,1.8,4),shipMat);nose.rotation.x=-Math.PI/2;nose.position.set(0,.2,-1);ship.add(hull,nose);ship.position.set(0,0,11);scene.add(ship);
const enemies=[],enemyMat=new THREE.MeshStandardMaterial({color:0xff5577,emissive:0x7a102a});function makeEnemy(x,z){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.62,16,10),enemyMat),ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.13,8,20),enemyMat);ring.rotation.x=Math.PI/2;g.add(body,ring);g.position.set(x,.1,z);scene.add(g);enemies.push(g)}for(let r=0;r<4;r++)for(let c=0;c<8;c++)makeEnemy((c-3.5)*2.15,-12+r*2);
const shots=[],enemyShots=[],shotGeo=new THREE.BoxGeometry(.15,.15,.8),shotMat=new THREE.MeshBasicMaterial({color:0x7dffcf}),badShotMat=new THREE.MeshBasicMaterial({color:0xff426c});function fire(list,x,z,dz,mat){const s=new THREE.Mesh(shotGeo,mat);s.position.set(x,.2,z);s.userData.dz=dz;scene.add(s);list.push(s)}
const keys=new Set(),status=document.getElementById('status');let score=0,lives=3,direction=1,speed=.018,lastFire=0,lastEnemyFire=0,ended=false;function update(msg='Fleet approaching'){status.textContent=`Score: ${score} | Shields: ${lives} | ${msg}`};function clearShots(list){list.splice(0).forEach(s=>scene.remove(s))}function reset(){score=0;lives=3;direction=1;speed=.018;ended=false;ship.position.x=0;enemies.forEach((e,i)=>{const r=Math.floor(i/8),c=i%8;e.position.set((c-3.5)*2.15,.1,-12+r*2);e.visible=true;e.userData.dead=false});clearShots(shots);clearShots(enemyShots);update()}
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' '){e.preventDefault();if(!ended&&performance.now()-lastFire>260){fire(shots,ship.position.x,10,-.48,shotMat);lastFire=performance.now()}}if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));reset();
function animate(t){requestAnimationFrame(animate);if(!ended){if(keys.has('arrowleft')||keys.has('a'))ship.position.x-=.16;if(keys.has('arrowright')||keys.has('d'))ship.position.x+=.16;ship.position.x=THREE.MathUtils.clamp(ship.position.x,-14,14);let edge=false;enemies.forEach(e=>{if(!e.userData.dead){e.position.x+=direction*speed;if(Math.abs(e.position.x)>14)edge=true;e.rotation.y+=.012}});if(edge){direction*=-1;enemies.forEach(e=>{if(!e.userData.dead)e.position.z+=.65});speed+=.002}const alive=enemies.filter(e=>!e.userData.dead);if(alive.length&&t-lastEnemyFire>850){const e=alive[Math.floor(Math.random()*alive.length)];fire(enemyShots,e.position.x,e.position.z,.22,badShotMat);lastEnemyFire=t}shots.forEach(s=>{s.position.z+=s.userData.dz;alive.forEach(e=>{if(!e.userData.dead&&Math.abs(s.position.x-e.position.x)<.75&&Math.abs(s.position.z-e.position.z)<.65){e.userData.dead=true;e.visible=false;s.position.z=-100;score+=20}})});enemyShots.forEach(s=>{s.position.z+=s.userData.dz;if(Math.abs(s.position.x-ship.position.x)<1.4&&Math.abs(s.position.z-ship.position.z)<.7){s.position.z=100;lives--;update('Direct hit!')}});[shots,enemyShots].forEach(list=>{for(let i=list.length-1;i>=0;i--)if(Math.abs(list[i].position.z)>30){scene.remove(list[i]);list.splice(i,1)}});if(!lives||alive.some(e=>e.position.z>8)){ended=true;update('Game over — press R')}else if(enemies.every(e=>e.userData.dead)){ended=true;update('Outpost saved! Press R')}}renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate(0);
</script></body></html>
